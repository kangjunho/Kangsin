<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Seurat object가 분석 가능한 객체로 완성되는 과정</title>
  <desc id="desc">원시 count를 가진 Seurat object에 QC, 정규화, 통합, 차원축소, 클러스터링, 세포 유형 주석 결과가 순서대로 추가되는 과정을 설명한다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#f8f7ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#325ea8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17335f" flood-opacity=".14"/>
    </filter>
    <style>
      .t{font-family:Arial,'Noto Sans KR',sans-serif;fill:#13284a}.h{font-weight:700}.small{font-size:20px}.body{font-size:23px}.head{font-size:31px}.step{font-size:22px;font-weight:700}.muted{fill:#53657e}.box{fill:#fff;stroke:#b9c9e3;stroke-width:2}.pill{fill:#eaf2ff;stroke:#77a4e6;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1500" height="760" rx="24" fill="url(#bg)"/>
  <text x="750" y="56" text-anchor="middle" class="t h head">Seurat object: 데이터를 담는 그릇에서 분석 결과를 담는 그릇으로</text>
  <text x="750" y="91" text-anchor="middle" class="t body muted">전처리와 분석은 객체를 새로 만드는 것이 아니라, 필요한 데이터와 결과를 정리하고 추가하는 과정입니다.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="145" width="330" height="470" rx="22" class="box" stroke="#4f76bb" stroke-width="3"/>
    <rect x="55" y="145" width="330" height="68" rx="22" fill="#244e91"/><rect x="55" y="190" width="330" height="23" fill="#244e91"/>
    <text x="220" y="188" text-anchor="middle" fill="#fff" class="h body">분석 시작 시점</text>
    <text x="220" y="253" text-anchor="middle" class="t h body">초기 Seurat object</text>
    <rect x="88" y="282" width="264" height="92" rx="12" fill="#e7faf8" stroke="#249792" stroke-width="2"/>
    <text x="220" y="318" text-anchor="middle" class="t h body">RNA assay</text>
    <text x="220" y="350" text-anchor="middle" class="t small">counts · data</text>
    <rect x="88" y="391" width="264" height="72" rx="12" class="pill"/>
    <text x="220" y="435" text-anchor="middle" class="t body">기본 meta.data</text>
    <rect x="88" y="480" width="264" height="72" rx="12" class="pill"/>
    <text x="220" y="512" text-anchor="middle" class="t small">Cell ID · sample · condition</text>
    <text x="220" y="540" text-anchor="middle" class="t small muted">(불러온 객체에 따라 기존 결과 포함)</text>
  </g>

  <line x1="400" y1="380" x2="500" y2="380" stroke="#325ea8" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="515" y="126" width="465" height="508" rx="22" class="box" stroke="#7a62bf" stroke-width="3"/>
    <rect x="515" y="126" width="465" height="68" rx="22" fill="#654ca8"/><rect x="515" y="171" width="465" height="23" fill="#654ca8"/>
    <text x="748" y="169" text-anchor="middle" fill="#fff" class="h body">이번 실습에서 수행할 처리</text>
    <g>
      <circle cx="565" cy="237" r="25" fill="#ef6a67"/><text x="565" y="245" text-anchor="middle" fill="#fff" class="h body">2</text>
      <text x="610" y="231" class="t step">QC · doublet 제거</text><text x="610" y="260" class="t small muted">저품질 세포를 제외하고 신뢰도 높은 세포 유지</text>
      <circle cx="565" cy="310" r="25" fill="#e69a2d"/><text x="565" y="318" text-anchor="middle" fill="#fff" class="h body">3</text>
      <text x="610" y="304" class="t step">정규화 · variable features</text><text x="610" y="333" class="t small muted">세포 간 비교가 가능하도록 발현값 변환</text>
      <circle cx="565" cy="383" r="25" fill="#5d9f55"/><text x="565" y="391" text-anchor="middle" fill="#fff" class="h body">4</text>
      <text x="610" y="377" class="t step">샘플 통합 · batch correction</text><text x="610" y="406" class="t small muted">6개 샘플의 기술적 차이를 완화</text>
      <circle cx="565" cy="456" r="25" fill="#367fbd"/><text x="565" y="464" text-anchor="middle" fill="#fff" class="h body">5</text>
      <text x="610" y="450" class="t step">PCA · UMAP · clustering</text><text x="610" y="479" class="t small muted">유사한 발현 특성을 가진 세포군 탐색</text>
      <circle cx="565" cy="529" r="25" fill="#8a60bf"/><text x="565" y="537" text-anchor="middle" fill="#fff" class="h body">6</text>
      <text x="610" y="523" class="t step">cell type annotation</text><text x="610" y="552" class="t small muted">marker gene을 근거로 세포 유형 해석</text>
      <circle cx="565" cy="602" r="25" fill="#b04d82"/><text x="565" y="610" text-anchor="middle" fill="#fff" class="h body">7+</text>
      <text x="610" y="596" class="t step">비율 · DEG · 기능 분석</text><text x="610" y="625" class="t small muted">조건별 생물학적 차이를 평가</text>
    </g>
  </g>

  <line x1="995" y1="380" x2="1095" y2="380" stroke="#325ea8" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1110" y="145" width="335" height="470" rx="22" class="box" stroke="#249277" stroke-width="3"/>
    <rect x="1110" y="145" width="335" height="68" rx="22" fill="#16765f"/><rect x="1110" y="190" width="335" height="23" fill="#16765f"/>
    <text x="1278" y="188" text-anchor="middle" fill="#fff" class="h body">분석 가능한 상태</text>
    <text x="1278" y="253" text-anchor="middle" class="t h body">처리된 Seurat object</text>
    <g class="t small">
      <rect x="1142" y="279" width="271" height="48" rx="10" fill="#e7faf8"/><text x="1278" y="310" text-anchor="middle">정규화된 발현값</text>
      <rect x="1142" y="338" width="271" height="48" rx="10" fill="#eef4ff"/><text x="1278" y="369" text-anchor="middle">QC 지표 · sample 정보</text>
      <rect x="1142" y="397" width="271" height="48" rx="10" fill="#eef4ff"/><text x="1278" y="428" text-anchor="middle">PCA · UMAP 좌표</text>
      <rect x="1142" y="456" width="271" height="48" rx="10" fill="#eef4ff"/><text x="1278" y="487" text-anchor="middle">이웃 graph · cluster</text>
      <rect x="1142" y="515" width="271" height="48" rx="10" fill="#f7edff"/><text x="1278" y="546" text-anchor="middle">cell type annotation</text>
    </g>
    <text x="1278" y="591" text-anchor="middle" class="t h small" fill="#16765f">시각화 · 비교 · 생물학적 해석</text>
  </g>

  <rect x="166" y="674" width="1168" height="54" rx="27" fill="#fff4d9" stroke="#e0a72d" stroke-width="2"/>
  <text x="750" y="708" text-anchor="middle" class="t body"><tspan class="h">핵심:</tspan> raw counts는 보존하고, 분석에 필요한 값과 결과를 layer · metadata · reductions · graphs에 추가합니다.</text>
</svg>
