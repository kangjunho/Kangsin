<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Single-cell RNA sequencing workflow</title><desc id="desc">Tissue is dissociated, cells are barcoded with UMIs, sequencing creates a cell by gene matrix, quality control and dimensionality reduction lead to clusters and biological annotation.</desc>
  <defs><linearGradient id="s" x1="0" x2="1"><stop stop-color="#f5f9ff"/><stop offset="1" stop-color="#f4fffb"/></linearGradient><marker id="as" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#5483ad"/></marker></defs>
  <rect width="1200" height="650" rx="24" fill="url(#s)"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#064f9e">Single-cell RNA-seq: Preserve Cellular Identity</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(45 105)"><rect width="200" height="170" rx="18" fill="#fff" stroke="#b7d4ed" stroke-width="2"/><text x="100" y="36" font-size="19" font-weight="700" fill="#0756a5">Tissue / cells</text><g fill="#74c0fc" stroke="#0d6efd"><circle cx="60" cy="90" r="25"/><circle cx="110" cy="75" r="23"/><circle cx="145" cy="115" r="27"/><circle cx="80" cy="130" r="22"/></g><g fill="#fff"><circle cx="60" cy="90" r="7"/><circle cx="110" cy="75" r="7"/><circle cx="145" cy="115" r="7"/><circle cx="80" cy="130" r="7"/></g><text x="100" y="158" font-size="13" fill="#607080">Dissociation / nuclei</text></g>
    <g transform="translate(285 105)"><rect width="200" height="170" rx="18" fill="#fff" stroke="#b7d4ed" stroke-width="2"/><text x="100" y="36" font-size="19" font-weight="700" fill="#0756a5">Barcodes + UMI</text><circle cx="100" cy="92" r="40" fill="#e7f2ff" stroke="#0d6efd" stroke-width="3"/><path d="M70 92h60M100 62v60" stroke="#0d6efd" stroke-width="3"/><text x="100" y="150" font-size="13" fill="#607080">cell ID + molecule ID</text></g>
    <g transform="translate(525 105)"><rect width="200" height="170" rx="18" fill="#fff" stroke="#b7d4ed" stroke-width="2"/><text x="100" y="36" font-size="19" font-weight="700" fill="#0756a5">Sequencing</text><g stroke-linecap="round" stroke-width="6"><line x1="40" y1="75" x2="160" y2="75" stroke="#ff6b6b"/><line x1="40" y1="100" x2="140" y2="100" stroke="#20c997"/><line x1="55" y1="125" x2="160" y2="125" stroke="#845ef7"/></g><text x="100" y="150" font-size="13" fill="#607080">FASTQ → count</text></g>
    <g transform="translate(765 105)"><rect width="200" height="170" rx="18" fill="#fff" stroke="#b7d4ed" stroke-width="2"/><text x="100" y="36" font-size="19" font-weight="700" fill="#0756a5">Cell × gene matrix</text><g transform="translate(43 55)" fill="#9ec5fe" stroke="#fff"><rect width="25" height="25"/><rect x="26" width="25" height="25" fill="#ddebff"/><rect x="52" width="25" height="25" fill="#0d6efd"/><rect x="78" width="25" height="25" fill="#ddebff"/><rect y="26" width="25" height="25" fill="#ddebff"/><rect x="26" y="26" width="25" height="25" fill="#0d6efd"/><rect x="52" y="26" width="25" height="25" fill="#ddebff"/><rect x="78" y="26" width="25" height="25"/><rect y="52" width="25" height="25" fill="#0d6efd"/><rect x="26" y="52" width="25" height="25" fill="#ddebff"/><rect x="52" y="52" width="25" height="25"/><rect x="78" y="52" width="25" height="25" fill="#ddebff"/></g><text x="100" y="150" font-size="13" fill="#607080">sparse counts</text></g>
    <g transform="translate(1005 105)"><rect width="150" height="170" rx="18" fill="#fff" stroke="#a9dacd" stroke-width="2"/><text x="75" y="36" font-size="19" font-weight="700" fill="#087f5b">Cell QC</text><text x="75" y="76" font-size="14" fill="#173f68">genes / UMI</text><text x="75" y="103" font-size="14" fill="#173f68">mitochondrial %</text><text x="75" y="130" font-size="14" fill="#173f68">doublets</text><text x="75" y="154" font-size="13" fill="#607080">ambient RNA</text></g>
  </g>
  <g stroke="#5483ad" stroke-width="3" marker-end="url(#as)"><line x1="245" y1="190" x2="275" y2="190"/><line x1="485" y1="190" x2="515" y2="190"/><line x1="725" y1="190" x2="755" y2="190"/><line x1="965" y1="190" x2="995" y2="190"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="65" y="355" width="230" height="125" rx="18" fill="#fff" stroke="#a9dacd" stroke-width="2"/><text x="180" y="392" font-size="19" font-weight="700" fill="#087f5b">Normalize &amp; select</text><text x="180" y="423" font-size="14" fill="#607080">highly variable genes</text><text x="180" y="450" font-size="14" fill="#607080">scale / model</text>
    <rect x="360" y="355" width="230" height="125" rx="18" fill="#fff" stroke="#a9dacd" stroke-width="2"/><text x="475" y="392" font-size="19" font-weight="700" fill="#087f5b">PCA &amp; neighbors</text><text x="475" y="423" font-size="14" fill="#607080">reduce dimensions</text><text x="475" y="450" font-size="14" fill="#607080">build kNN graph</text>
    <rect x="655" y="355" width="230" height="125" rx="18" fill="#fff" stroke="#a9dacd" stroke-width="2"/><text x="770" y="392" font-size="19" font-weight="700" fill="#087f5b">Cluster &amp; visualize</text><circle cx="735" cy="438" r="8" fill="#ff6b6b"/><circle cx="758" cy="447" r="8" fill="#ff6b6b"/><circle cx="795" cy="426" r="8" fill="#20c997"/><circle cx="820" cy="439" r="8" fill="#20c997"/><circle cx="784" cy="459" r="8" fill="#845ef7"/>
    <rect x="950" y="355" width="190" height="125" rx="18" fill="#fff" stroke="#a9dacd" stroke-width="2"/><text x="1045" y="392" font-size="19" font-weight="700" fill="#087f5b">Annotate</text><text x="1045" y="423" font-size="14" fill="#607080">markers + reference</text><text x="1045" y="450" font-size="14" fill="#607080">biological context</text></g>
  <g stroke="#5483ad" stroke-width="3" marker-end="url(#as)"><path d="M1080 275V315H180V345" fill="none"/><line x1="295" y1="417" x2="350" y2="417"/><line x1="590" y1="417" x2="645" y2="417"/><line x1="885" y1="417" x2="940" y2="417"/></g>
  <rect x="120" y="540" width="960" height="70" rx="18" fill="#fff3cd" stroke="#f0c36d"/><text x="600" y="570" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#6f5200">Cells are measurements; donors are biological replicates.</text><text x="600" y="595" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#6f5200">Condition-level inference should preserve donor structure, often using cell-type-specific pseudobulk profiles.</text>
</svg>
