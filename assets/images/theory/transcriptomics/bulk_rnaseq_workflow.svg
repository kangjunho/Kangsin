<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Bulk RNA sequencing workflow</title><desc id="desc">A workflow from biological question and study design through RNA extraction, sequencing, quantification, quality control, differential expression and interpretation.</desc>
  <defs><linearGradient id="b" x1="0" x2="1"><stop stop-color="#f4f9ff"/><stop offset="1" stop-color="#f8fbff"/></linearGradient><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#5d7f9e"/></marker></defs>
  <rect width="1200" height="610" rx="24" fill="url(#b)"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#064f9e">Bulk Transcriptomics: From Question to Interpretation</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(55 105)"><rect width="220" height="125" rx="16" fill="#fff" stroke="#b7d4ed" stroke-width="2"/><circle cx="45" cy="45" r="22" fill="#0d6efd"/><text x="45" y="52" font-size="21" font-weight="700" fill="#fff">1</text><text x="125" y="40" font-size="19" font-weight="700" fill="#0756a5">Study design</text><text x="125" y="70" font-size="14" fill="#607080">Replicates · groups</text><text x="125" y="94" font-size="14" fill="#607080">pairing · batch</text></g>
    <g transform="translate(335 105)"><rect width="220" height="125" rx="16" fill="#fff" stroke="#b7d4ed" stroke-width="2"/><circle cx="45" cy="45" r="22" fill="#0d6efd"/><text x="45" y="52" font-size="21" font-weight="700" fill="#fff">2</text><text x="130" y="40" font-size="19" font-weight="700" fill="#0756a5">RNA &amp; library</text><text x="130" y="70" font-size="14" fill="#607080">RNA integrity</text><text x="130" y="94" font-size="14" fill="#607080">poly(A) / depletion</text></g>
    <g transform="translate(615 105)"><rect width="220" height="125" rx="16" fill="#fff" stroke="#b7d4ed" stroke-width="2"/><circle cx="45" cy="45" r="22" fill="#0d6efd"/><text x="45" y="52" font-size="21" font-weight="700" fill="#fff">3</text><text x="130" y="40" font-size="19" font-weight="700" fill="#0756a5">Sequencing</text><text x="130" y="70" font-size="14" fill="#607080">FASTQ + base quality</text><text x="130" y="94" font-size="14" fill="#607080">single / paired-end</text></g>
    <g transform="translate(895 105)"><rect width="250" height="125" rx="16" fill="#fff" stroke="#b7d4ed" stroke-width="2"/><circle cx="45" cy="45" r="22" fill="#0d6efd"/><text x="45" y="52" font-size="21" font-weight="700" fill="#fff">4</text><text x="145" y="40" font-size="19" font-weight="700" fill="#0756a5">Quantification</text><text x="145" y="70" font-size="14" fill="#607080">alignment / pseudoalignment</text><text x="145" y="94" font-size="14" fill="#607080">gene × sample counts</text></g>
  </g>
  <g stroke="#5d7f9e" stroke-width="3" marker-end="url(#ab)"><line x1="275" y1="168" x2="325" y2="168"/><line x1="555" y1="168" x2="605" y2="168"/><line x1="835" y1="168" x2="885" y2="168"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(125 335)"><rect width="250" height="125" rx="16" fill="#fff" stroke="#a9dacd" stroke-width="2"/><circle cx="45" cy="45" r="22" fill="#087f5b"/><text x="45" y="52" font-size="21" font-weight="700" fill="#fff">5</text><text x="145" y="40" font-size="19" font-weight="700" fill="#087f5b">Sample QC</text><text x="145" y="70" font-size="14" fill="#607080">library size · mapping</text><text x="145" y="94" font-size="14" fill="#607080">PCA · correlation</text></g>
    <g transform="translate(475 335)"><rect width="250" height="125" rx="16" fill="#fff" stroke="#a9dacd" stroke-width="2"/><circle cx="45" cy="45" r="22" fill="#087f5b"/><text x="45" y="52" font-size="21" font-weight="700" fill="#fff">6</text><text x="145" y="40" font-size="19" font-weight="700" fill="#087f5b">Statistical model</text><text x="145" y="70" font-size="14" fill="#607080">normalization · design</text><text x="145" y="94" font-size="14" fill="#607080">contrast · FDR</text></g>
    <g transform="translate(825 335)"><rect width="250" height="125" rx="16" fill="#fff" stroke="#a9dacd" stroke-width="2"/><circle cx="45" cy="45" r="22" fill="#087f5b"/><text x="45" y="52" font-size="21" font-weight="700" fill="#fff">7</text><text x="145" y="40" font-size="19" font-weight="700" fill="#087f5b">Interpretation</text><text x="145" y="70" font-size="14" fill="#607080">DE genes · pathways</text><text x="145" y="94" font-size="14" fill="#607080">validation · report</text></g>
  </g>
  <g stroke="#5d7f9e" stroke-width="3" marker-end="url(#ab)"><path d="M1020 230V285H250V325" fill="none"/><line x1="375" y1="398" x2="465" y2="398"/><line x1="725" y1="398" x2="815" y2="398"/></g>
  <rect x="150" y="520" width="900" height="55" rx="27" fill="#fff3cd" stroke="#f0c36d"/>
  <text x="600" y="554" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#6f5200"><tspan font-weight="700">Design comes first:</tspan> additional biological replicates often improve inference more than simply sequencing the same samples deeper.</text>
</svg>
