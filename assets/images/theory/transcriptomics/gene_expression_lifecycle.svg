<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Gene expression lifecycle and regulatory checkpoints</title>
  <desc id="desc">DNA is transcribed to pre-mRNA, processed into alternative mature transcripts, translated or degraded, with regulation at multiple stages.</desc>
  <defs><linearGradient id="bg2" x1="0" x2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#f6fffb"/></linearGradient><marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#47789f"/></marker></defs>
  <rect width="1200" height="660" rx="24" fill="url(#bg2)"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#064f9e">Gene Expression Is a Regulated Lifecycle</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(45 105)"><rect width="210" height="160" rx="18" fill="#fff" stroke="#b9d5f0" stroke-width="2"/><text x="105" y="35" font-size="21" font-weight="700" fill="#0756a5">DNA &amp; chromatin</text><path d="M28 82C60 48 80 116 110 82S162 48 185 82" fill="none" stroke="#0d6efd" stroke-width="7"/><path d="M28 112C60 78 80 146 110 112S162 78 185 112" fill="none" stroke="#74b9ff" stroke-width="7"/><text x="105" y="145" font-size="14" fill="#607080">Promoter · enhancer · TF</text></g>
    <g transform="translate(320 105)"><rect width="210" height="160" rx="18" fill="#fff" stroke="#b9d5f0" stroke-width="2"/><text x="105" y="35" font-size="21" font-weight="700" fill="#0756a5">Pre-mRNA</text><line x1="25" y1="92" x2="185" y2="92" stroke="#8e9fb0" stroke-width="4"/><rect x="35" y="72" width="36" height="40" rx="5" fill="#ff8787"/><rect x="89" y="72" width="36" height="40" rx="5" fill="#51cf66"/><rect x="143" y="72" width="36" height="40" rx="5" fill="#748ffc"/><text x="105" y="145" font-size="14" fill="#607080">Exons + introns</text></g>
    <g transform="translate(595 105)"><rect width="250" height="160" rx="18" fill="#fff" stroke="#b9d5f0" stroke-width="2"/><text x="125" y="35" font-size="21" font-weight="700" fill="#0756a5">RNA processing</text><text x="125" y="73" font-size="16" fill="#173f68">5′ cap</text><text x="125" y="103" font-size="16" fill="#173f68">Alternative splicing</text><text x="125" y="133" font-size="16" fill="#173f68">3′ poly(A) tail</text></g>
    <g transform="translate(910 105)"><rect width="245" height="160" rx="18" fill="#fff" stroke="#a9dacd" stroke-width="2"/><text x="122" y="35" font-size="21" font-weight="700" fill="#087f5b">Mature RNA</text><line x1="25" y1="88" x2="215" y2="88" stroke="#087f5b" stroke-width="5"/><rect x="40" y="69" width="40" height="38" rx="5" fill="#ff8787"/><rect x="92" y="69" width="40" height="38" rx="5" fill="#51cf66"/><rect x="144" y="69" width="40" height="38" rx="5" fill="#748ffc"/><text x="122" y="140" font-size="14" fill="#607080">Transcript / isoform</text></g>
  </g>
  <g stroke="#47789f" stroke-width="3" marker-end="url(#a2)"><line x1="255" y1="185" x2="310" y2="185"/><line x1="530" y1="185" x2="585" y2="185"/><line x1="845" y1="185" x2="900" y2="185"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <text x="282" y="164" font-size="14" fill="#607080">transcription</text><text x="872" y="164" font-size="14" fill="#607080">export</text>
    <rect x="255" y="335" width="300" height="120" rx="18" fill="#fff" stroke="#a9dacd" stroke-width="2"/><text x="405" y="372" font-size="21" font-weight="700" fill="#087f5b">Translation</text><g fill="#20c997"><circle cx="330" cy="412" r="10"/><circle cx="360" cy="412" r="10"/><circle cx="390" cy="412" r="10"/><circle cx="420" cy="412" r="10"/><circle cx="450" cy="412" r="10"/><circle cx="480" cy="412" r="10"/></g><text x="405" y="442" font-size="14" fill="#607080">Protein output</text>
    <rect x="645" y="335" width="300" height="120" rx="18" fill="#fff" stroke="#f0c36d" stroke-width="2"/><text x="795" y="372" font-size="21" font-weight="700" fill="#9a6700">RNA degradation</text><path d="M700 413l25-18 25 18 25-18 25 18 25-18 25 18" fill="none" stroke="#f59f00" stroke-width="6"/><text x="795" y="442" font-size="14" fill="#607080">Controls RNA lifetime</text>
  </g>
  <g stroke="#47789f" stroke-width="3" marker-end="url(#a2)"><path d="M1030 265C1015 325 650 292 535 342" fill="none"/><path d="M1030 265C1025 305 930 315 890 342" fill="none"/></g>
  <g font-family="Arial,sans-serif"><rect x="80" y="520" width="1040" height="92" rx="18" fill="#eaf4ff"/><text x="600" y="552" text-anchor="middle" font-size="20" font-weight="700" fill="#0756a5">Observed RNA abundance is a balance, not a direct switch</text><text x="600" y="585" text-anchor="middle" font-size="18" fill="#173f68">RNA abundance at a time point ≈ RNA synthesis − RNA degradation, modified by processing, transport, and cell composition</text></g>
</svg>
