<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Genome and transcriptome comparison</title>
  <desc id="desc">The same genome can generate different transcriptomes depending on cell type, time, treatment and environment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f4f9ff"/><stop offset="1" stop-color="#eefaf8"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5483ad"/></marker>
  </defs>
  <rect width="1200" height="620" rx="26" fill="url(#bg)"/>
  <text x="600" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#064f9e">One Genome, Many Transcriptomes</text>
  <g filter="url(#shadow)">
    <rect x="65" y="105" width="330" height="410" rx="20" fill="#fff" stroke="#b7d4ed" stroke-width="2"/>
    <rect x="805" y="105" width="330" height="410" rx="20" fill="#fff" stroke="#a9dacd" stroke-width="2"/>
  </g>
  <text x="230" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0756a5">Genome</text>
  <text x="230" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#5e7182">Stored DNA information</text>
  <path d="M115 245 C150 190 190 300 230 245 S310 190 350 245" fill="none" stroke="#0d6efd" stroke-width="9"/>
  <path d="M115 300 C150 245 190 355 230 300 S310 245 350 300" fill="none" stroke="#60a5fa" stroke-width="9"/>
  <g stroke="#5d86ad" stroke-width="3"><line x1="130" y1="237" x2="130" y2="292"/><line x1="160" y1="228" x2="160" y2="315"/><line x1="190" y1="252" x2="190" y2="330"/><line x1="220" y1="267" x2="220" y2="316"/><line x1="250" y1="239" x2="250" y2="290"/><line x1="280" y1="220" x2="280" y2="280"/><line x1="310" y1="232" x2="310" y2="301"/><line x1="340" y1="256" x2="340" y2="324"/></g>
  <text x="230" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173f68">Relatively stable</text>
  <text x="230" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#607080">Nearly every nucleated cell</text>
  <text x="230" y="444" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#607080">contains the same genome</text>
  <g font-family="Arial,sans-serif" font-size="17" fill="#173f68" text-anchor="middle">
    <rect x="455" y="130" width="290" height="66" rx="33" fill="#ddebff"/><text x="600" y="170">Cell type</text>
    <rect x="455" y="215" width="290" height="66" rx="33" fill="#e8f5e9"/><text x="600" y="255">Development &amp; time</text>
    <rect x="455" y="300" width="290" height="66" rx="33" fill="#fff3cd"/><text x="600" y="340">Treatment &amp; disease</text>
    <rect x="455" y="385" width="290" height="66" rx="33" fill="#f3e8ff"/><text x="600" y="425">Environment</text>
  </g>
  <g stroke="#5483ad" stroke-width="3" marker-end="url(#arrow)"><line x1="395" y1="310" x2="445" y2="310"/><line x1="755" y1="310" x2="795" y2="310"/></g>
  <text x="970" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#087f5b">Transcriptome</text>
  <text x="970" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#5e7182">RNA present in a context</text>
  <g fill="none" stroke-linecap="round" stroke-width="7"><path d="M855 235 C900 205 930 265 975 235 S1060 205 1095 235" stroke="#ff6b6b"/><path d="M855 285 C900 255 930 315 975 285 S1060 255 1095 285" stroke="#20c997"/><path d="M855 335 C900 305 930 365 975 335 S1060 305 1095 335" stroke="#845ef7"/><path d="M855 385 C900 355 930 415 975 385 S1060 355 1095 385" stroke="#f59f00"/></g>
  <g font-family="Arial,sans-serif" font-size="15" fill="#607080"><text x="865" y="225">RNA A</text><text x="865" y="275">RNA B</text><text x="865" y="325">RNA C</text><text x="865" y="375">RNA D</text></g>
  <text x="970" y="454" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173f68">Dynamic and selective</text>
  <text x="970" y="482" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#607080">RNA identity, amount, isoform,</text>
  <text x="970" y="506" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#607080">location, and timing can change</text>
  <text x="600" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#173f68">Transcriptomics asks which parts of the genome are expressed, how much, in which form, and in which biological context.</text>
</svg>
