<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Bulk, single-cell and spatial transcriptomics comparison</title><desc id="desc">Bulk transcriptomics measures an average signal, single-cell transcriptomics separates cell profiles without location, and spatial transcriptomics retains tissue coordinates.</desc>
  <defs><linearGradient id="c" x1="0" x2="1"><stop stop-color="#f5f9ff"/><stop offset="1" stop-color="#f6fffb"/></linearGradient></defs>
  <rect width="1200" height="650" rx="24" fill="url(#c)"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#064f9e">Three Views of the Same Tissue</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(45 95)"><rect width="340" height="455" rx="20" fill="#fff" stroke="#b7d4ed" stroke-width="2"/><text x="170" y="40" font-size="24" font-weight="700" fill="#0756a5">Bulk RNA</text><text x="170" y="68" font-size="15" fill="#607080">One profile per sample</text><g transform="translate(65 105)"><g fill="#ff8787" stroke="#c92a2a"><circle cx="45" cy="35" r="25"/><circle cx="105" cy="45" r="25"/></g><g fill="#63e6be" stroke="#087f5b"><circle cx="155" cy="35" r="25"/><circle cx="205" cy="70" r="25"/></g><g fill="#b197fc" stroke="#6741d9"><circle cx="55" cy="95" r="25"/><circle cx="120" cy="105" r="25"/><circle cx="180" cy="120" r="25"/></g></g><path d="M70 265H270" stroke="#5d7f9e" stroke-width="3"/><rect x="92" y="287" width="156" height="50" rx="8" fill="#ddebff"/><text x="170" y="319" font-size="18" font-weight="700" fill="#0756a5">Average signal</text><text x="170" y="375" font-size="15" fill="#173f68">Strong for sample-level</text><text x="170" y="398" font-size="15" fill="#173f68">comparisons</text><text x="170" y="432" font-size="14" fill="#9a6700">Cell mixtures can confound</text></g>
    <g transform="translate(430 95)"><rect width="340" height="455" rx="20" fill="#fff" stroke="#a9dacd" stroke-width="2"/><text x="170" y="40" font-size="24" font-weight="700" fill="#087f5b">Single-cell RNA</text><text x="170" y="68" font-size="15" fill="#607080">One profile per captured cell</text><g transform="translate(62 105)"><g fill="#ff8787" stroke="#c92a2a"><circle cx="45" cy="35" r="25"/><circle cx="105" cy="45" r="25"/></g><g fill="#63e6be" stroke="#087f5b"><circle cx="155" cy="35" r="25"/><circle cx="205" cy="70" r="25"/></g><g fill="#b197fc" stroke="#6741d9"><circle cx="55" cy="95" r="25"/><circle cx="120" cy="105" r="25"/><circle cx="180" cy="120" r="25"/></g></g><g transform="translate(74 275)"><circle cx="35" cy="25" r="8" fill="#ff6b6b"/><circle cx="60" cy="38" r="8" fill="#ff6b6b"/><circle cx="150" cy="28" r="8" fill="#20c997"/><circle cx="178" cy="42" r="8" fill="#20c997"/><circle cx="78" cy="75" r="8" fill="#845ef7"/><circle cx="105" cy="86" r="8" fill="#845ef7"/><circle cx="136" cy="72" r="8" fill="#845ef7"/></g><text x="170" y="390" font-size="15" fill="#173f68">Cell types and states</text><text x="170" y="413" font-size="15" fill="#173f68">become separable</text><text x="170" y="447" font-size="14" fill="#9a6700">Original location is usually lost</text></g>
    <g transform="translate(815 95)"><rect width="340" height="455" rx="20" fill="#fff" stroke="#d9c2f2" stroke-width="2"/><text x="170" y="40" font-size="24" font-weight="700" fill="#6741d9">Spatial RNA</text><text x="170" y="68" font-size="15" fill="#607080">Expression + tissue coordinates</text><path d="M55 110C90 75 140 95 165 125C205 85 275 110 285 170C290 225 235 260 180 245C130 275 60 240 55 180Z" fill="#f3e8ff" stroke="#845ef7" stroke-width="3"/><g><circle cx="110" cy="145" r="11" fill="#ff6b6b"/><circle cx="145" cy="132" r="11" fill="#ff6b6b"/><circle cx="215" cy="155" r="11" fill="#20c997"/><circle cx="240" cy="190" r="11" fill="#20c997"/><circle cx="125" cy="210" r="11" fill="#845ef7"/><circle cx="165" cy="195" r="11" fill="#845ef7"/></g><text x="170" y="305" font-size="15" fill="#173f68">Domains, neighborhoods,</text><text x="170" y="328" font-size="15" fill="#173f68">and tissue architecture</text><text x="170" y="374" font-size="14" fill="#9a6700">A spot may contain multiple cells;</text><text x="170" y="397" font-size="14" fill="#9a6700">imaging methods depend on</text><text x="170" y="420" font-size="14" fill="#9a6700">segmentation and target panels</text></g>
  </g>
  <g font-family="Arial,sans-serif"><rect x="145" y="580" width="910" height="45" rx="22" fill="#eaf4ff"/><text x="600" y="608" text-anchor="middle" font-size="17" fill="#173f68"><tspan font-weight="700" fill="#0756a5">Choose by question:</tspan> sample-level change, cellular heterogeneity, or gene expression in anatomical context.</text></g>
</svg>
