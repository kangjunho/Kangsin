<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Bulk expression matrix, sample metadata and model design</title><desc id="desc">A gene by sample count matrix is matched to sample metadata and analyzed with a design and contrast while accounting for tissue composition.</desc>
  <defs><linearGradient id="m" x1="0" x2="1"><stop stop-color="#f4f9ff"/><stop offset="1" stop-color="#f8fbff"/></linearGradient><marker id="am" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#5483ad"/></marker></defs>
  <rect width="1200" height="620" rx="24" fill="url(#m)"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#064f9e">The Analysis Unit Is a Sample, Not a Read</text>
  <g transform="translate(55 95)" font-family="Arial,sans-serif">
    <rect width="430" height="310" rx="18" fill="#fff" stroke="#b7d4ed" stroke-width="2"/>
    <text x="215" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#0756a5">Gene × sample count matrix</text>
    <g transform="translate(35 65)" font-size="14" text-anchor="middle"><rect width="360" height="205" fill="#f8fbff" stroke="#d6e4f0"/><g stroke="#d6e4f0"><line x1="80" y1="0" x2="80" y2="205"/><line x1="150" y1="0" x2="150" y2="205"/><line x1="220" y1="0" x2="220" y2="205"/><line x1="290" y1="0" x2="290" y2="205"/><line x1="0" y1="42" x2="360" y2="42"/><line x1="0" y1="83" x2="360" y2="83"/><line x1="0" y1="124" x2="360" y2="124"/><line x1="0" y1="165" x2="360" y2="165"/></g><g fill="#173f68"><text x="115" y="27">S1</text><text x="185" y="27">S2</text><text x="255" y="27">S3</text><text x="325" y="27">S4</text><text x="40" y="68">GENE1</text><text x="40" y="109">GENE2</text><text x="40" y="150">GENE3</text><text x="40" y="191">…</text><text x="115" y="68">124</text><text x="185" y="68">98</text><text x="255" y="68">370</text><text x="325" y="68">415</text><text x="115" y="109">8</text><text x="185" y="109">11</text><text x="255" y="109">7</text><text x="325" y="109">9</text><text x="115" y="150">840</text><text x="185" y="150">790</text><text x="255" y="150">402</text><text x="325" y="150">388</text></g></g>
  </g>
  <g transform="translate(715 95)" font-family="Arial,sans-serif">
    <rect width="430" height="310" rx="18" fill="#fff" stroke="#a9dacd" stroke-width="2"/><text x="215" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#087f5b">Sample metadata</text>
    <g transform="translate(35 65)" font-size="14" text-anchor="middle"><rect width="360" height="205" fill="#f8fffc" stroke="#cce7df"/><g stroke="#cce7df"><line x1="70" y1="0" x2="70" y2="205"/><line x1="175" y1="0" x2="175" y2="205"/><line x1="270" y1="0" x2="270" y2="205"/><line x1="0" y1="42" x2="360" y2="42"/><line x1="0" y1="83" x2="360" y2="83"/><line x1="0" y1="124" x2="360" y2="124"/><line x1="0" y1="165" x2="360" y2="165"/></g><g fill="#173f68"><text x="35" y="27">sample</text><text x="122" y="27">group</text><text x="222" y="27">patient</text><text x="315" y="27">batch</text><text x="35" y="68">S1</text><text x="122" y="68">Control</text><text x="222" y="68">P01</text><text x="315" y="68">A</text><text x="35" y="109">S2</text><text x="122" y="109">Control</text><text x="222" y="109">P02</text><text x="315" y="109">B</text><text x="35" y="150">S3</text><text x="122" y="150">Disease</text><text x="222" y="150">P03</text><text x="315" y="150">A</text><text x="35" y="191">S4</text><text x="122" y="191">Disease</text><text x="222" y="191">P04</text><text x="315" y="191">B</text></g></g>
  </g>
  <g stroke="#5483ad" stroke-width="3" marker-end="url(#am)"><line x1="495" y1="245" x2="700" y2="245"/></g><text x="598" y="227" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0756a5">same sample IDs and order</text>
  <g font-family="Arial,sans-serif"><rect x="185" y="460" width="830" height="92" rx="18" fill="#eaf4ff"/><text x="600" y="493" text-anchor="middle" font-size="20" font-weight="700" fill="#0756a5">Model: expression ~ group + batch + other planned covariates</text><text x="600" y="526" text-anchor="middle" font-size="17" fill="#173f68">Contrast: Disease − Control → log2 fold change, uncertainty, P-value, and FDR</text></g>
  <text x="600" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#9a6700">Bulk signal also reflects cell-type composition: an apparent gene change may arise because the proportion of cells changed.</text>
</svg>
