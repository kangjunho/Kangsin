<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Genome-wide association study workflow and outputs</title>
  <desc id="desc">A GWAS proceeds from phenotype and cohort design through sample and variant quality control, phasing and imputation, association testing, Manhattan and QQ plots, replication, fine mapping, and functional follow-up.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#347bb7"/></marker></defs>
  <rect width="1200" height="850" rx="28" fill="#f6faff"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#074f9d">GWAS: From Cohort Design to an Associated Locus</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial" font-size="16" fill="#526b83">Millions of tests require strict phenotype definition, genotype QC, ancestry control, and replication</text>
  <g font-family="Arial">
    <g transform="translate(50 116)"><rect width="200" height="125" rx="16" fill="#fff" stroke="#6aa6dc" stroke-width="2"/><circle cx="28" cy="28" r="18" fill="#0756a5"/><text x="28" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text><text x="108" y="33" text-anchor="middle" font-size="18" font-weight="700" fill="#0756a5">Study design</text><text x="100" y="67" text-anchor="middle" font-size="13" fill="#526b83">case–control or quantitative</text><text x="100" y="90" text-anchor="middle" font-size="13" fill="#526b83">phenotype · consent · power</text><text x="100" y="113" text-anchor="middle" font-size="13" fill="#526b83">discovery + replication</text></g>
    <line x1="255" y1="178" x2="280" y2="178" stroke="#347bb7" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(287 116)"><rect width="200" height="125" rx="16" fill="#fff" stroke="#6aa6dc" stroke-width="2"/><circle cx="28" cy="28" r="18" fill="#0756a5"/><text x="28" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text><text x="112" y="33" text-anchor="middle" font-size="18" font-weight="700" fill="#0756a5">Genotypes</text><text x="100" y="67" text-anchor="middle" font-size="13" fill="#526b83">SNP array or sequencing</text><text x="100" y="90" text-anchor="middle" font-size="13" fill="#526b83">sample + variant QC</text><text x="100" y="113" text-anchor="middle" font-size="13" fill="#526b83">phase and impute</text></g>
    <line x1="492" y1="178" x2="517" y2="178" stroke="#347bb7" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(524 116)"><rect width="200" height="125" rx="16" fill="#fff" stroke="#9574c5" stroke-width="2"/><circle cx="28" cy="28" r="18" fill="#7451a5"/><text x="28" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text><text x="112" y="33" text-anchor="middle" font-size="18" font-weight="700" fill="#684889">Association</text><text x="100" y="67" text-anchor="middle" font-size="13" fill="#526b83">phenotype ~ dosage</text><text x="100" y="90" text-anchor="middle" font-size="13" fill="#526b83">+ age · sex · PCs · batch</text><text x="100" y="113" text-anchor="middle" font-size="13" fill="#526b83">β/OR · SE · P · N</text></g>
    <line x1="729" y1="178" x2="754" y2="178" stroke="#347bb7" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(761 116)"><rect width="200" height="125" rx="16" fill="#fff" stroke="#46ad8d" stroke-width="2"/><circle cx="28" cy="28" r="18" fill="#24856b"/><text x="28" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">4</text><text x="112" y="33" text-anchor="middle" font-size="18" font-weight="700" fill="#24745f">Results QC</text><text x="100" y="67" text-anchor="middle" font-size="13" fill="#526b83">Manhattan + QQ plot</text><text x="100" y="90" text-anchor="middle" font-size="13" fill="#526b83">inflation · artifacts</text><text x="100" y="113" text-anchor="middle" font-size="13" fill="#526b83">summary statistics</text></g>
    <line x1="966" y1="178" x2="991" y2="178" stroke="#347bb7" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(998 116)"><rect width="152" height="125" rx="16" fill="#fff5df" stroke="#e3b341" stroke-width="2"/><circle cx="25" cy="28" r="18" fill="#b57a08"/><text x="25" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">5</text><text x="84" y="33" text-anchor="middle" font-size="17" font-weight="700" fill="#8d5d08">Follow-up</text><text x="76" y="67" text-anchor="middle" font-size="13" fill="#526b83">replication</text><text x="76" y="90" text-anchor="middle" font-size="13" fill="#526b83">fine-mapping</text><text x="76" y="113" text-anchor="middle" font-size="13" fill="#526b83">functional study</text></g>

    <rect x="55" y="285" width="1090" height="135" rx="17" fill="#fff" stroke="#cadbea" stroke-width="2"/>
    <text x="85" y="320" font-size="19" font-weight="700" fill="#173f68">QC before association</text>
    <text x="85" y="355" font-size="14" font-weight="700" fill="#0756a5">Sample QC</text><text x="185" y="355" font-size="14" fill="#526b83">call rate · heterozygosity · sex check · duplicates/relatedness · ancestry/PCA · phenotype completeness</text>
    <text x="85" y="389" font-size="14" font-weight="700" fill="#684889">Variant QC</text><text x="185" y="389" font-size="14" fill="#526b83">missingness · allele frequency/count · Hardy–Weinberg · batch effect · imputation INFO · allele alignment</text>

    <rect x="55" y="455" width="760" height="325" rx="18" fill="#fff" stroke="#cadbea" stroke-width="2"/>
    <text x="435" y="492" text-anchor="middle" font-size="21" font-weight="700" fill="#0756a5">Manhattan plot</text>
    <line x1="100" y1="720" x2="780" y2="720" stroke="#8ca9c4" stroke-width="2"/><line x1="100" y1="520" x2="100" y2="720" stroke="#8ca9c4" stroke-width="2"/>
    <line x1="100" y1="570" x2="780" y2="570" stroke="#d9534f" stroke-width="2" stroke-dasharray="8 6"/><text x="770" y="560" text-anchor="end" font-size="12" fill="#b12b27">P = 5 × 10⁻⁸</text>
    <text x="67" y="620" text-anchor="middle" font-size="13" fill="#526b83" transform="rotate(-90 67 620)">−log₁₀(P)</text><text x="440" y="758" text-anchor="middle" font-size="13" fill="#526b83">Genomic position by chromosome</text>
    <g fill="#2f80c4"><circle cx="116" cy="690" r="4"/><circle cx="131" cy="670" r="4"/><circle cx="146" cy="701" r="4"/><circle cx="161" cy="660" r="4"/><circle cx="176" cy="683" r="4"/><circle cx="191" cy="647" r="4"/><circle cx="206" cy="693" r="4"/><circle cx="221" cy="676" r="4"/><circle cx="236" cy="701" r="4"/><circle cx="251" cy="655" r="4"/><circle cx="266" cy="688" r="4"/></g>
    <g fill="#7451a5"><circle cx="286" cy="692" r="4"/><circle cx="301" cy="680" r="4"/><circle cx="316" cy="650" r="4"/><circle cx="331" cy="635" r="4"/><circle cx="346" cy="592" r="4"/><circle cx="361" cy="545" r="5"/><circle cx="376" cy="517" r="6"/><circle cx="391" cy="548" r="5"/><circle cx="406" cy="601" r="4"/><circle cx="421" cy="654" r="4"/><circle cx="436" cy="688" r="4"/></g>
    <g fill="#2f80c4"><circle cx="456" cy="701" r="4"/><circle cx="471" cy="670" r="4"/><circle cx="486" cy="682" r="4"/><circle cx="501" cy="645" r="4"/><circle cx="516" cy="699" r="4"/><circle cx="531" cy="675" r="4"/><circle cx="546" cy="689" r="4"/><circle cx="561" cy="660" r="4"/><circle cx="576" cy="700" r="4"/></g>
    <g fill="#7451a5"><circle cx="596" cy="684" r="4"/><circle cx="611" cy="650" r="4"/><circle cx="626" cy="620" r="4"/><circle cx="641" cy="579" r="4"/><circle cx="656" cy="560" r="5"/><circle cx="671" cy="596" r="4"/><circle cx="686" cy="642" r="4"/><circle cx="701" cy="680" r="4"/><circle cx="716" cy="692" r="4"/><circle cx="731" cy="665" r="4"/><circle cx="746" cy="701" r="4"/></g>
    <text x="376" y="506" text-anchor="middle" font-size="13" font-weight="700" fill="#684889">lead SNP / associated locus</text>

    <rect x="845" y="455" width="300" height="325" rx="18" fill="#fff" stroke="#cadbea" stroke-width="2"/>
    <text x="995" y="492" text-anchor="middle" font-size="21" font-weight="700" fill="#0756a5">How to read the result</text>
    <text x="875" y="537" font-size="14" font-weight="700" fill="#173f68">Peak</text><text x="875" y="560" font-size="13" fill="#526b83">One LD region may produce many</text><text x="875" y="580" font-size="13" fill="#526b83">correlated significant SNPs.</text>
    <text x="875" y="621" font-size="14" font-weight="700" fill="#173f68">Lead SNP</text><text x="875" y="644" font-size="13" fill="#526b83">Strongest statistical marker;</text><text x="875" y="664" font-size="13" fill="#526b83">not automatically causal.</text>
    <text x="875" y="705" font-size="14" font-weight="700" fill="#173f68">Next step</text><text x="875" y="728" font-size="13" fill="#526b83">replicate → fine-map → map gene</text><text x="875" y="748" font-size="13" fill="#526b83">→ functional validation</text>
    <text x="600" y="822" text-anchor="middle" font-size="14" fill="#526b83">A small P value measures incompatibility with the null model; it does not measure effect size, causality, or clinical usefulness.</text>
  </g>
</svg>
