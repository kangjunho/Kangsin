<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">From genome to phenotype: the omics landscape</title>
  <desc id="desc">Biological information flows through genome, transcriptome, proteome and metabolome, while environment affects multiple layers.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f9ff"/><stop offset="1" stop-color="#e4f1ff"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3b76b8"/></marker></defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#074f9d">The Omics Landscape</text>
  <text x="600" y="92" text-anchor="middle" font-family="Arial" font-size="17" fill="#526b83">-ome = the complete set · -omics = large-scale study of that set</text>
  <g font-family="Arial" text-anchor="middle">
    <g transform="translate(60 190)"><rect width="190" height="180" rx="18" fill="#126fd1"/><text x="95" y="54" font-size="24" font-weight="700" fill="white">Genome</text><text x="95" y="88" font-size="17" fill="#eaf4ff">DNA</text><text x="95" y="118" font-size="16" fill="white">Genomics</text><text x="95" y="150" font-size="14" fill="#d8ebff">Biological potential</text></g>
    <g transform="translate(285 190)"><rect width="190" height="180" rx="18" fill="#2489d8"/><text x="95" y="54" font-size="23" font-weight="700" fill="white">Transcriptome</text><text x="95" y="88" font-size="17" fill="#eaf4ff">RNA</text><text x="95" y="118" font-size="16" fill="white">Transcriptomics</text><text x="95" y="150" font-size="14" fill="#e0f1ff">Genes being expressed</text></g>
    <g transform="translate(510 190)"><rect width="190" height="180" rx="18" fill="#2ca5c8"/><text x="95" y="54" font-size="23" font-weight="700" fill="white">Proteome</text><text x="95" y="88" font-size="17" fill="#eaffff">Proteins</text><text x="95" y="118" font-size="16" fill="white">Proteomics</text><text x="95" y="150" font-size="14" fill="#e0fbff">Cellular machinery</text></g>
    <g transform="translate(735 190)"><rect width="190" height="180" rx="18" fill="#3ab49c"/><text x="95" y="54" font-size="23" font-weight="700" fill="white">Metabolome</text><text x="95" y="88" font-size="17" fill="#effff9">Metabolites</text><text x="95" y="118" font-size="16" fill="white">Metabolomics</text><text x="95" y="150" font-size="14" fill="#e1fff6">Biochemical state</text></g>
    <g transform="translate(960 190)"><rect width="180" height="180" rx="18" fill="#4c78a8"/><text x="90" y="62" font-size="23" font-weight="700" fill="white">Phenotype</text><text x="90" y="103" font-size="16" fill="white">Traits · Disease</text><text x="90" y="139" font-size="14" fill="#e8f1fb">Observed outcome</text></g>
  </g>
  <g stroke="#3b76b8" stroke-width="4" marker-end="url(#arrow)"><line x1="252" y1="280" x2="280" y2="280"/><line x1="477" y1="280" x2="505" y2="280"/><line x1="702" y1="280" x2="730" y2="280"/><line x1="927" y1="280" x2="955" y2="280"/></g>
  <g font-family="Arial"><rect x="280" y="465" width="640" height="110" rx="18" fill="white" stroke="#a9caeb" stroke-width="2"/><text x="600" y="505" text-anchor="middle" font-size="22" font-weight="700" fill="#074f9d">Multi-omics integration</text><text x="600" y="540" text-anchor="middle" font-size="17" fill="#526b83">Combines molecular layers to understand biological systems</text><text x="600" y="565" text-anchor="middle" font-size="15" fill="#6a7f92">Context matters: cell type · tissue · time · environment</text></g>
  <g stroke="#e49b2f" stroke-width="3" stroke-dasharray="8 7"><line x1="100" y1="430" x2="1090" y2="430"/></g><text x="1100" y="424" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#a86708">Environment</text>
</svg>
