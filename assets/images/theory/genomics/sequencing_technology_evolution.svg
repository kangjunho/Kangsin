<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Evolution of sequencing technologies</title>
  <desc id="desc">Sanger sequencing introduced chain termination in 1977 for accurate sequencing of individual fragments. Massively parallel short-read sequencing emerged in the mid-2000s to sequence millions of fragments at low cost per base. Single-molecule long-read methods developed in the 2010s to span repetitive regions, structural variants, haplotypes and full-length transcripts.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#347bb7"/></marker></defs>
  <rect width="1200" height="720" rx="28" fill="#f6faff"/>
  <text x="600" y="54" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#074f9d">How Sequencing Technologies Evolved</text>
  <text x="600" y="84" text-anchor="middle" font-family="Arial" font-size="16" fill="#526b83">From one DNA fragment at a time to millions of fragments, then back to individual long molecules</text>
  <line x1="125" y1="150" x2="1070" y2="150" stroke="#91bce4" stroke-width="7" marker-end="url(#arrow)"/>
  <g font-family="Arial" text-anchor="middle">
    <circle cx="215" cy="150" r="22" fill="#176fd0"/><text x="215" y="125" font-size="18" font-weight="700" fill="#0756a5">1977</text>
    <circle cx="600" cy="150" r="22" fill="#8e71b5"/><text x="600" y="125" font-size="18" font-weight="700" fill="#684889">Mid-2000s</text>
    <circle cx="985" cy="150" r="22" fill="#3ab49c"/><text x="985" y="125" font-size="18" font-weight="700" fill="#24745f">2010s–present</text>

    <g transform="translate(55 205)"><rect width="320" height="405" rx="20" fill="#ffffff" stroke="#82b8e8" stroke-width="2"/><text x="160" y="43" font-size="23" font-weight="700" fill="#0756a5">Sanger sequencing</text><path d="M60 90h205M60 115h170M60 140h130M60 165h90" stroke="#176fd0" stroke-width="7"/><circle cx="265" cy="90" r="7" fill="#f4b942"/><circle cx="230" cy="115" r="7" fill="#f4b942"/><circle cx="190" cy="140" r="7" fill="#f4b942"/><circle cx="150" cy="165" r="7" fill="#f4b942"/><text x="160" y="210" font-size="16" font-weight="700" fill="#173f68">Chain termination + capillary</text><text x="160" y="244" font-size="15" fill="#526b83">~500–1,000 bp/read</text><text x="160" y="271" font-size="15" fill="#526b83">One or a few targets per reaction</text><text x="160" y="298" font-size="15" fill="#526b83">High-quality consensus trace</text><text x="160" y="340" font-size="14" fill="#526b83">Low total cost for one target</text><text x="160" y="363" font-size="14" fill="#526b83">but high cost per base</text><text x="160" y="392" font-size="14" font-weight="700" fill="#0756a5">Validation · plasmid · amplicon</text></g>

    <g transform="translate(440 205)"><rect width="320" height="405" rx="20" fill="#ffffff" stroke="#b9a4d6" stroke-width="2"/><text x="160" y="43" font-size="23" font-weight="700" fill="#684889">Short-read NGS</text><g fill="#8e71b5"><rect x="55" y="85" width="50" height="13" rx="6"/><rect x="125" y="85" width="50" height="13" rx="6"/><rect x="195" y="85" width="50" height="13" rx="6"/><rect x="80" y="116" width="50" height="13" rx="6"/><rect x="150" y="116" width="50" height="13" rx="6"/><rect x="220" y="116" width="50" height="13" rx="6"/><rect x="55" y="147" width="50" height="13" rx="6"/><rect x="125" y="147" width="50" height="13" rx="6"/><rect x="195" y="147" width="50" height="13" rx="6"/></g><text x="160" y="210" font-size="16" font-weight="700" fill="#173f68">Massively parallel sequencing</text><text x="160" y="244" font-size="15" fill="#526b83">Usually ~50–300 bp/read</text><text x="160" y="271" font-size="15" fill="#526b83">Millions–billions of reads</text><text x="160" y="298" font-size="15" fill="#526b83">High depth and low cost per base</text><text x="160" y="340" font-size="14" fill="#526b83">Requires batching and computation;</text><text x="160" y="363" font-size="14" fill="#526b83">short reads lose long-range context</text><text x="160" y="392" font-size="14" font-weight="700" fill="#684889">Panel · WES · WGS · RNA-seq</text></g>

    <g transform="translate(825 205)"><rect width="320" height="405" rx="20" fill="#ffffff" stroke="#69bba6" stroke-width="2"/><text x="160" y="43" font-size="23" font-weight="700" fill="#24745f">Long-read sequencing</text><path d="M45 120C85 70 125 170 165 120C205 70 245 170 285 120" fill="none" stroke="#3ab49c" stroke-width="10"/><text x="160" y="210" font-size="16" font-weight="700" fill="#173f68">Single-molecule sequencing</text><text x="160" y="244" font-size="15" fill="#526b83">HiFi commonly ~10–25+ kb</text><text x="160" y="271" font-size="15" fill="#526b83">Nanopore can reach 100 kb+</text><text x="160" y="298" font-size="15" fill="#526b83">Long-range linkage and phasing</text><text x="160" y="340" font-size="14" fill="#526b83">Higher input-quality demand;</text><text x="160" y="363" font-size="14" fill="#526b83">cost and accuracy depend on platform</text><text x="160" y="392" font-size="14" font-weight="700" fill="#24745f">SV · repeats · assembly · isoforms</text></g>
  </g>
  <rect x="100" y="640" width="1000" height="45" rx="11" fill="#dceeff"/>
  <text x="600" y="669" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#0756a5">These technologies are complementary: the best choice is determined by the biological question.</text>
</svg>
