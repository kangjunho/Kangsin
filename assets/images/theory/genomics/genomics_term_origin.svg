<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">How the term genomics came into being</title>
  <desc id="desc">A four-step timeline from the 1986 Bethesda meeting through planning a new journal and Thomas Roderick proposing the word genomics, ending with the genome-wide view of biology.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6faff"/>
      <stop offset="1" stop-color="#eaf4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#5b7da0" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#074f9d">How “Genomics” Came Into Being</text>
  <text x="600" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#526b83">From mapping an entire genome to understanding it as an integrated biological system</text>

  <line x1="150" y1="330" x2="1050" y2="330" stroke="#8bb9e4" stroke-width="7" stroke-linecap="round"/>
  <path d="M1040 317 L1070 330 L1040 343 Z" fill="#8bb9e4"/>

  <g font-family="Arial, sans-serif">
    <g transform="translate(45 135)" filter="url(#shadow)">
      <rect width="250" height="155" rx="17" fill="#ffffff" stroke="#c9dff3"/>
      <circle cx="42" cy="42" r="24" fill="#0d6efd"/>
      <path d="M30 48 h24 M32 39 h20 M36 30 h12" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="78" y="35" font-size="16" font-weight="700" fill="#0756a5">1986 · Bethesda</text>
      <text x="78" y="58" font-size="13" fill="#607080">International meeting</text>
      <text x="22" y="92" font-size="15" font-weight="700" fill="#173f68">Could an entire human genome</text>
      <text x="22" y="116" font-size="15" font-weight="700" fill="#173f68">be systematically mapped?</text>
      <text x="22" y="141" font-size="13" fill="#607080">A genome-wide research agenda emerges.</text>
    </g>

    <g transform="translate(340 370)" filter="url(#shadow)">
      <rect width="250" height="155" rx="17" fill="#ffffff" stroke="#c9dff3"/>
      <rect x="22" y="20" width="43" height="54" rx="3" fill="#3b8edb"/>
      <path d="M31 34 h25 M31 44 h25 M31 54 h18" stroke="#fff" stroke-width="3"/>
      <text x="82" y="36" font-size="16" font-weight="700" fill="#0756a5">A New Journal</text>
      <text x="82" y="59" font-size="13" fill="#607080">Ruddle &amp; McKusick</text>
      <text x="22" y="97" font-size="15" font-weight="700" fill="#173f68">A publication was planned for</text>
      <text x="22" y="121" font-size="15" font-weight="700" fill="#173f68">large-scale genome research.</text>
      <text x="22" y="143" font-size="13" fill="#607080">“Genome” was already being considered.</text>
    </g>

    <g transform="translate(635 135)" filter="url(#shadow)">
      <rect width="250" height="155" rx="17" fill="#ffffff" stroke="#c9dff3"/>
      <path d="M27 23 h43 l-5 48 q-17 12 -33 0 z" fill="#f2b84b" stroke="#c98b17" stroke-width="2"/>
      <path d="M70 32 q17 1 15 16 q-2 13 -18 12" fill="none" stroke="#c98b17" stroke-width="4"/>
      <text x="98" y="36" font-size="16" font-weight="700" fill="#0756a5">Beer &amp; Naming</text>
      <text x="98" y="59" font-size="13" fill="#607080">Thomas H. Roderick</text>
      <text x="22" y="97" font-size="15" font-weight="700" fill="#173f68">During an informal discussion,</text>
      <text x="22" y="121" font-size="15" font-weight="700" fill="#173f68">Roderick proposed “Genomics.”</text>
      <text x="22" y="143" font-size="13" fill="#607080">A journal name became a field name.</text>
    </g>

    <g transform="translate(930 370)" filter="url(#shadow)">
      <rect width="225" height="155" rx="17" fill="#ffffff" stroke="#c9dff3"/>
      <circle cx="43" cy="45" r="26" fill="#25a58c"/>
      <path d="M24 45 q19 -27 38 0 q-19 27 -38 0 M24 45 q19 27 38 0 q-19 -27 -38 0" fill="none" stroke="#fff" stroke-width="3"/>
      <text x="84" y="36" font-size="16" font-weight="700" fill="#0756a5">A New View</text>
      <text x="84" y="59" font-size="13" fill="#607080">Genome as a whole</text>
      <text x="18" y="97" font-size="14" font-weight="700" fill="#173f68">Sequence, maps, methods,</text>
      <text x="18" y="120" font-size="14" font-weight="700" fill="#173f68">comparison and evolution</text>
      <text x="18" y="143" font-size="13" fill="#607080">were considered together.</text>
    </g>
  </g>

  <circle cx="170" cy="330" r="18" fill="#0d6efd" stroke="#fff" stroke-width="6"/>
  <circle cx="465" cy="330" r="18" fill="#338ad3" stroke="#fff" stroke-width="6"/>
  <circle cx="760" cy="330" r="18" fill="#2e9fb8" stroke="#fff" stroke-width="6"/>
  <circle cx="1045" cy="330" r="18" fill="#25a58c" stroke="#fff" stroke-width="6"/>

  <rect x="170" y="585" width="860" height="76" rx="17" fill="#d9ecff"/>
  <text x="600" y="616" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0756a5">The conceptual shift</text>
  <text x="600" y="644" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#405d78">From studying isolated genes to interpreting the genome as a functioning, evolving whole</text>
</svg>
