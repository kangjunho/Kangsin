<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">From a clinical snapshot to a molecular disease trajectory</title>
  <desc id="desc">Traditional clinical labels capture selected time points, whereas longitudinal molecular profiling follows predisposition, early change, diagnosis, treatment, response and resistance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7faff"/><stop offset="1" stop-color="#f3f8f4"/></linearGradient>
    <linearGradient id="trajectory" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a82c5"/><stop offset="0.52" stop-color="#8a63b4"/><stop offset="1" stop-color="#d37c27"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#294760" flood-opacity="0.14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5e7890"/></marker>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="600" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#173f64">From a Clinical Snapshot to a Molecular Trajectory</text>
  <text x="600" y="91" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#536a7e">Disease is observed at named clinical stages, but its molecular state can change continuously.</text>

  <text x="75" y="145" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#51687d">Traditional view</text>
  <line x1="260" y1="139" x2="1125" y2="139" stroke="#9aabb9" stroke-width="3" stroke-dasharray="7 7"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(363 112)"><rect width="150" height="54" rx="14" fill="#ffffff" stroke="#6f89a0" stroke-width="2"/><text x="75" y="34" font-size="16" font-weight="700" fill="#425b72">At-risk</text></g>
    <g transform="translate(590 112)"><rect width="150" height="54" rx="14" fill="#ffffff" stroke="#8a63b4" stroke-width="2"/><text x="75" y="34" font-size="16" font-weight="700" fill="#67468e">Diagnosis</text></g>
    <g transform="translate(817 112)"><rect width="150" height="54" rx="14" fill="#ffffff" stroke="#d18020" stroke-width="2"/><text x="75" y="34" font-size="16" font-weight="700" fill="#995d10">Response / relapse</text></g>
  </g>
  <text x="600" y="197" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#687d8f">Useful clinical categories, but only selected observations of a changing process</text>

  <text x="75" y="260" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#51687d">Longitudinal view</text>
  <path d="M155 414 C260 405 274 348 370 352 C477 357 473 292 570 307 C673 323 676 423 774 383 C855 350 893 265 1048 295" fill="none" stroke="url(#trajectory)" stroke-width="11" stroke-linecap="round"/>
  <line x1="148" y1="454" x2="1070" y2="454" stroke="#5e7890" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1100" y="438" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#52697f">time</text>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g transform="translate(152 287)"><circle cx="0" cy="126" r="13" fill="#3a82c5"/><text x="0" y="184" font-size="17" font-weight="700" fill="#245f95">Predisposition</text><text x="0" y="208" font-size="13" fill="#62788c">germline · environment</text></g>
    <g transform="translate(370 225)"><circle cx="0" cy="127" r="13" fill="#5478bd"/><text x="0" y="247" font-size="17" font-weight="700" fill="#3e5c99">Early molecular change</text><text x="0" y="271" font-size="13" fill="#62788c">before clear symptoms</text></g>
    <g transform="translate(570 180)"><circle cx="0" cy="127" r="13" fill="#8665b4"/><text x="0" y="292" font-size="17" font-weight="700" fill="#67468e">Clinical diagnosis</text><text x="0" y="316" font-size="13" fill="#62788c">phenotype crosses a threshold</text></g>
    <g transform="translate(774 256)"><circle cx="0" cy="127" r="13" fill="#b06a73"/><text x="0" y="216" font-size="17" font-weight="700" fill="#824854">Treatment</text><text x="0" y="240" font-size="13" fill="#62788c">new selective pressure</text></g>
    <g transform="translate(1018 168)"><circle cx="30" cy="127" r="13" fill="#d18020"/><text x="30" y="304" font-size="17" font-weight="700" fill="#995d10">Response or resistance</text><text x="30" y="328" font-size="13" fill="#62788c">state may diverge again</text></g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="96" y="523" width="1008" height="91" rx="19" fill="#ffffff" stroke="#a8c5dc" stroke-width="2"/>
    <text x="600" y="555" font-size="20" font-weight="700" fill="#174d7c">Serial samples add real time to molecular measurement</text>
    <text x="600" y="584" font-size="15" fill="#5a7084">tissue · blood / ctDNA · repeated omics · imaging · clinical events</text>
    <text x="600" y="605" font-size="13" fill="#748798">A cross-sectional trajectory or pseudotime is an inferred order, not automatically elapsed clinical time.</text>
  </g>

  <rect x="172" y="640" width="856" height="49" rx="15" fill="#173f64"/>
  <text x="600" y="671" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Precision medicine asks not only “which treatment?” but also “for whom, in which state, and when?”</text>
</svg>
