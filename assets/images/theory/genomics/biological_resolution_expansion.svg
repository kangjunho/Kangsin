<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Expanding the coordinates of biological observation</title>
  <desc id="desc">Technology expanded biological observation from selected genes to molecular layers, individual cells, tissue space, disease time and precision decisions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6faff"/><stop offset="1" stop-color="#edf7f3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#294a69" flood-opacity="0.14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64809b"/></marker>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="600" y="55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#123e67">Expanding the Coordinates of Biology</text>
  <text x="600" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#52697f">New technologies did not replace earlier views; they added new coordinates to the same biology.</text>

  <g font-family="Arial, Helvetica, sans-serif" filter="url(#shadow)">
    <g transform="translate(42 157)">
      <rect width="195" height="270" rx="22" fill="#ffffff" stroke="#2b72b7" stroke-width="3"/>
      <circle cx="97.5" cy="62" r="39" fill="#e4f1ff" stroke="#2b72b7" stroke-width="3"/>
      <text x="97.5" y="69" text-anchor="middle" font-size="21" font-weight="700" fill="#1e5f9d">BRCA1</text>
      <text x="97.5" y="130" text-anchor="middle" font-size="24" font-weight="700" fill="#174d7c">Gene</text>
      <text x="97.5" y="166" text-anchor="middle" font-size="16" fill="#52697f">Which gene?</text>
      <text x="97.5" y="202" text-anchor="middle" font-size="14" fill="#667b8f">PCR · Sanger</text>
      <text x="97.5" y="225" text-anchor="middle" font-size="14" fill="#667b8f">candidate-gene studies</text>
      <text x="97.5" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#2b72b7">selected targets</text>
    </g>
    <g transform="translate(272 157)">
      <rect width="195" height="270" rx="22" fill="#ffffff" stroke="#7359ad" stroke-width="3"/>
      <g transform="translate(48 31)"><rect width="100" height="16" rx="8" fill="#426eaf"/><rect y="23" width="100" height="16" rx="8" fill="#785fb4"/><rect y="46" width="100" height="16" rx="8" fill="#2c9ab2"/></g>
      <text x="97.5" y="130" text-anchor="middle" font-size="23" font-weight="700" fill="#5e468f">Molecular layers</text>
      <text x="97.5" y="166" text-anchor="middle" font-size="16" fill="#52697f">Which patterns?</text>
      <text x="97.5" y="202" text-anchor="middle" font-size="14" fill="#667b8f">array · NGS · MS</text>
      <text x="97.5" y="225" text-anchor="middle" font-size="14" fill="#667b8f">multi-omics</text>
      <text x="97.5" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#7359ad">genome-wide systems</text>
    </g>
    <g transform="translate(502 157)">
      <rect width="195" height="270" rx="22" fill="#ffffff" stroke="#2491a8" stroke-width="3"/>
      <g transform="translate(51 27)"><circle cx="30" cy="35" r="26" fill="#dff6fa" stroke="#2491a8" stroke-width="3"/><circle cx="30" cy="35" r="9" fill="#2491a8"/><circle cx="71" cy="42" r="22" fill="#eaf8ee" stroke="#3e9655" stroke-width="3"/><circle cx="71" cy="42" r="7" fill="#3e9655"/></g>
      <text x="97.5" y="130" text-anchor="middle" font-size="24" font-weight="700" fill="#1d7386">Cell</text>
      <text x="97.5" y="166" text-anchor="middle" font-size="16" fill="#52697f">In which cell?</text>
      <text x="97.5" y="202" text-anchor="middle" font-size="14" fill="#667b8f">single-cell RNA/ATAC</text>
      <text x="97.5" y="225" text-anchor="middle" font-size="14" fill="#667b8f">cellular heterogeneity</text>
      <text x="97.5" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#2491a8">cell identity and state</text>
    </g>
    <g transform="translate(732 157)">
      <rect width="195" height="270" rx="22" fill="#ffffff" stroke="#3e9655" stroke-width="3"/>
      <g transform="translate(52 27)"><path d="M4 10C29-4 71 1 89 23C104 42 83 76 52 74C22 72-10 44 4 10Z" fill="#eaf8ee" stroke="#3e9655" stroke-width="3"/><circle cx="27" cy="29" r="7" fill="#2c8fa4"/><circle cx="54" cy="47" r="8" fill="#7b5db1"/><circle cx="76" cy="26" r="6" fill="#d58323"/><circle cx="30" cy="59" r="5" fill="#3e9655"/></g>
      <text x="97.5" y="130" text-anchor="middle" font-size="24" font-weight="700" fill="#2e7440">Space</text>
      <text x="97.5" y="166" text-anchor="middle" font-size="16" fill="#52697f">Where in tissue?</text>
      <text x="97.5" y="202" text-anchor="middle" font-size="14" fill="#667b8f">spatial omics · imaging</text>
      <text x="97.5" y="225" text-anchor="middle" font-size="14" fill="#667b8f">cellular neighbourhoods</text>
      <text x="97.5" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#3e9655">location and interaction</text>
    </g>
    <g transform="translate(962 157)">
      <rect width="195" height="270" rx="22" fill="#ffffff" stroke="#d18020" stroke-width="3"/>
      <line x1="38" y1="63" x2="157" y2="63" stroke="#d18020" stroke-width="4"/>
      <circle cx="40" cy="63" r="10" fill="#ffe8c9" stroke="#d18020" stroke-width="3"/><circle cx="79" cy="63" r="10" fill="#ffd292" stroke="#d18020" stroke-width="3"/><circle cx="118" cy="63" r="10" fill="#eea247" stroke="#d18020" stroke-width="3"/><circle cx="157" cy="63" r="10" fill="#d18020"/>
      <text x="97.5" y="130" text-anchor="middle" font-size="24" font-weight="700" fill="#9a5f12">Time</text>
      <text x="97.5" y="166" text-anchor="middle" font-size="16" fill="#52697f">When does it change?</text>
      <text x="97.5" y="202" text-anchor="middle" font-size="14" fill="#667b8f">serial sampling · ctDNA</text>
      <text x="97.5" y="225" text-anchor="middle" font-size="14" fill="#667b8f">longitudinal profiling</text>
      <text x="97.5" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#d18020">trajectory and evolution</text>
    </g>
  </g>

  <g stroke="#64809b" stroke-width="4" marker-end="url(#arrow)"><line x1="239" y1="292" x2="265" y2="292"/><line x1="469" y1="292" x2="495" y2="292"/><line x1="699" y1="292" x2="725" y2="292"/><line x1="929" y1="292" x2="955" y2="292"/></g>

  <rect x="92" y="485" width="1016" height="105" rx="21" fill="#183f64"/>
  <text x="600" y="526" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Molecule + cell identity + location + time + clinical context</text>
  <text x="600" y="561" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#dceaf7">Each coordinate adds context and makes the biological question more specific.</text>

  <rect x="222" y="620" width="756" height="64" rx="18" fill="#ffffff" stroke="#d18020" stroke-width="2.5"/>
  <text x="600" y="647" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#9a5f12">Precision medicine</text>
  <text x="600" y="672" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#52697f">the right prevention, diagnosis or treatment for the right person at the right time - after clinical validation</text>
</svg>
