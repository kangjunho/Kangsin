<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Evolution of the gene concept</title><desc id="desc">The gene concept evolved from a hereditary factor to a chromosomal locus, a DNA unit encoding protein, and a genomic sequence producing functional RNA or protein in a regulatory context.</desc>
  <rect width="1200" height="570" rx="28" fill="#f6faff"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#074f9d">How the Concept of a Gene Changed</text>
  <line x1="105" y1="300" x2="1095" y2="300" stroke="#91bce4" stroke-width="6"/>
  <g font-family="Arial" text-anchor="middle">
    <g transform="translate(100 120)"><circle cx="110" cy="180" r="26" fill="#176fd0"/><rect width="220" height="140" rx="15" fill="#e6f1ff"/><text x="110" y="38" font-size="20" font-weight="700" fill="#0756a5">1860s</text><text x="110" y="72" font-size="18" font-weight="700" fill="#173f68">Hereditary factor</text><text x="110" y="103" font-size="14" fill="#526b83">Mendelian unit inferred</text><text x="110" y="124" font-size="14" fill="#526b83">from inherited traits</text><text x="110" y="245" font-size="16" font-weight="700" fill="#0756a5">Trait-level concept</text></g>
    <g transform="translate(390 120)"><circle cx="110" cy="180" r="26" fill="#2489d8"/><rect width="220" height="140" rx="15" fill="#e6f1ff"/><text x="110" y="38" font-size="20" font-weight="700" fill="#0756a5">1909–1940s</text><text x="110" y="72" font-size="18" font-weight="700" fill="#173f68">Gene as a locus</text><text x="110" y="103" font-size="14" fill="#526b83">A unit located on</text><text x="110" y="124" font-size="14" fill="#526b83">a chromosome</text><text x="110" y="245" font-size="16" font-weight="700" fill="#0756a5">Physical location</text></g>
    <g transform="translate(680 120)"><circle cx="110" cy="180" r="26" fill="#2ca5c8"/><rect width="220" height="140" rx="15" fill="#e6f1ff"/><text x="110" y="38" font-size="20" font-weight="700" fill="#0756a5">1950s–1980s</text><text x="110" y="72" font-size="18" font-weight="700" fill="#173f68">DNA → RNA → Protein</text><text x="110" y="103" font-size="14" fill="#526b83">A DNA segment encoding</text><text x="110" y="124" font-size="14" fill="#526b83">a molecular product</text><text x="110" y="245" font-size="16" font-weight="700" fill="#0756a5">Molecular definition</text></g>
    <g transform="translate(970 120)"><circle cx="110" cy="180" r="26" fill="#3ab49c"/><rect x="-20" width="260" height="140" rx="15" fill="#e6f1ff"/><text x="110" y="38" font-size="20" font-weight="700" fill="#0756a5">Post-genome era</text><text x="110" y="72" font-size="18" font-weight="700" fill="#173f68">Functional genomic unit</text><text x="110" y="103" font-size="14" fill="#526b83">Alternative transcripts, ncRNA,</text><text x="110" y="124" font-size="14" fill="#526b83">overlap and distributed regulation</text><text x="110" y="245" font-size="16" font-weight="700" fill="#0756a5">Context-dependent function</text></g>
  </g>
  <rect x="160" y="450" width="880" height="75" rx="15" fill="#dceeff"/><text x="600" y="483" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#0756a5">Modern view</text><text x="600" y="510" text-anchor="middle" font-family="Arial" font-size="16" fill="#526b83">A gene can produce a functional protein or RNA and cannot always be reduced to one simple continuous region.</text>
</svg>
