<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">From biological sample to FASTQ</title>
  <desc id="desc">The workflow moves from sample collection and stabilization through DNA extraction, quality control, library preparation, sequencing, base calling and demultiplexing to compressed FASTQ files. Sample identity, DNA quantity, purity, integrity and library size are important checkpoints.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#347bb7"/></marker></defs>
  <rect width="1200" height="720" rx="28" fill="#f6faff"/>
  <text x="600" y="54" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#074f9d">From Biological Sample to FASTQ</text>
  <text x="600" y="84" text-anchor="middle" font-family="Arial" font-size="16" fill="#526b83">Pre-analytical quality is carried into every downstream step</text>

  <g font-family="Arial" text-anchor="middle">
    <g transform="translate(55 125)"><rect width="245" height="180" rx="18" fill="#ffffff" stroke="#82b8e8" stroke-width="2"/><circle cx="122" cy="58" r="29" fill="#176fd0"/><path d="M112 39h20v38h-20zM103 50h38v16h-38z" fill="#fff"/><text x="122" y="111" font-size="20" font-weight="700" fill="#0756a5">1. Sample</text><text x="122" y="139" font-size="14" fill="#526b83">Blood · tissue · cells</text><text x="122" y="162" font-size="14" fill="#526b83">Identity · storage · cold chain</text></g>
    <line x1="300" y1="215" x2="345" y2="215" stroke="#347bb7" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(355 125)"><rect width="245" height="180" rx="18" fill="#ffffff" stroke="#82b8e8" stroke-width="2"/><path d="M95 35h55v18l-8 17v35c0 16-39 16-39 0V70l-8-17z" fill="#62a9e3"/><path d="M104 79h37v25c0 8-37 8-37 0z" fill="#176fd0"/><text x="122" y="111" font-size="20" font-weight="700" fill="#0756a5">2. DNA Extraction</text><text x="122" y="139" font-size="14" fill="#526b83">Remove protein · salts · inhibitors</text><text x="122" y="162" font-size="14" fill="#526b83">Preserve HMW DNA for long reads</text></g>
    <line x1="600" y1="215" x2="645" y2="215" stroke="#347bb7" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(655 125)"><rect width="245" height="180" rx="18" fill="#e9fbf6" stroke="#59b99f" stroke-width="2"/><path d="M85 70h75M90 58c20-25 45 25 65 0M90 82c20-25 45 25 65 0" fill="none" stroke="#2f9d83" stroke-width="5"/><text x="122" y="111" font-size="20" font-weight="700" fill="#24745f">3. Input QC</text><text x="122" y="139" font-size="14" fill="#526b83">Quantity · purity · integrity</text><text x="122" y="162" font-size="14" fill="#526b83">Contamination · fragment size</text></g>
    <line x1="900" y1="215" x2="945" y2="215" stroke="#347bb7" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(955 125)"><rect width="190" height="180" rx="18" fill="#fff7e6" stroke="#e0a11e" stroke-width="2"/><text x="95" y="48" font-size="17" font-weight="700" fill="#8d5d08">GO / NO-GO</text><text x="95" y="81" font-size="14" fill="#715500">Enough DNA?</text><text x="95" y="105" font-size="14" fill="#715500">Clean enough?</text><text x="95" y="129" font-size="14" fill="#715500">Long enough?</text><text x="95" y="157" font-size="13" fill="#715500">Repeat extraction if needed</text></g>

    <g transform="translate(55 380)"><rect width="245" height="190" rx="18" fill="#ffffff" stroke="#b9a4d6" stroke-width="2"/><line x1="48" y1="57" x2="197" y2="57" stroke="#8e71b5" stroke-width="7"/><rect x="40" y="43" width="24" height="28" rx="5" fill="#f4b942"/><rect x="181" y="43" width="24" height="28" rx="5" fill="#f4b942"/><text x="122" y="106" font-size="20" font-weight="700" fill="#684889">4. Library Prep</text><text x="122" y="134" font-size="14" fill="#526b83">Fragment or size-select DNA</text><text x="122" y="157" font-size="14" fill="#526b83">Repair ends · ligate adapters</text><text x="122" y="180" font-size="14" fill="#526b83">Add sample indexes · optional PCR</text></g>
    <line x1="300" y1="475" x2="345" y2="475" stroke="#347bb7" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(355 380)"><rect width="245" height="190" rx="18" fill="#ffffff" stroke="#b9a4d6" stroke-width="2"/><rect x="62" y="40" width="120" height="54" rx="8" fill="#e6f1ff"/><g fill="#176fd0"><circle cx="82" cy="57" r="5"/><circle cx="103" cy="57" r="5"/><circle cx="124" cy="57" r="5"/><circle cx="145" cy="57" r="5"/><circle cx="166" cy="57" r="5"/><circle cx="92" cy="78" r="5"/><circle cx="113" cy="78" r="5"/><circle cx="134" cy="78" r="5"/><circle cx="155" cy="78" r="5"/></g><text x="122" y="118" font-size="20" font-weight="700" fill="#684889">5. Library QC</text><text x="122" y="146" font-size="14" fill="#526b83">Library concentration</text><text x="122" y="169" font-size="14" fill="#526b83">Insert-size distribution</text></g>
    <line x1="600" y1="475" x2="645" y2="475" stroke="#347bb7" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(655 380)"><rect width="245" height="190" rx="18" fill="#ffffff" stroke="#69bba6" stroke-width="2"/><rect x="80" y="35" width="85" height="65" rx="10" fill="#3ab49c"/><path d="M98 53h49v29H98z" fill="#fff"/><text x="122" y="125" font-size="20" font-weight="700" fill="#24745f">6. Sequencing</text><text x="122" y="153" font-size="14" fill="#526b83">Measure optical/electrical signal</text><text x="122" y="176" font-size="14" fill="#526b83">Generate raw instrument data</text></g>
    <line x1="900" y1="475" x2="945" y2="475" stroke="#347bb7" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(955 380)"><rect width="190" height="190" rx="18" fill="#e6f1ff" stroke="#82b8e8" stroke-width="2"/><text x="95" y="48" font-size="18" font-weight="700" fill="#0756a5">7. Primary Analysis</text><text x="95" y="81" font-size="14" fill="#526b83">Base calling</text><text x="95" y="105" font-size="14" fill="#526b83">Quality scoring</text><text x="95" y="129" font-size="14" fill="#526b83">Demultiplex by index</text><rect x="32" y="148" width="126" height="28" rx="7" fill="#176fd0"/><text x="95" y="168" font-size="15" font-weight="700" fill="#fff">sample_R1.fastq.gz</text></g>
  </g>

  <rect x="55" y="615" width="1090" height="65" rx="14" fill="#dceeff"/>
  <text x="600" y="642" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#0756a5">Adapters make molecules readable · indexes identify samples · insert is the biological DNA between adapters</text>
  <text x="600" y="666" text-anchor="middle" font-family="Arial" font-size="15" fill="#526b83">A failed sample cannot be rescued completely by deeper sequencing.</text>
</svg>
