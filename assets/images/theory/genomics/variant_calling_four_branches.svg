<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">Four variant calling workflows</title>
  <desc id="desc">Analysis-ready BAM or CRAM files enter separate germline, somatic, copy-number, and mitochondrial calling workflows that produce different outputs and require different evidence.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#347bb7"/></marker></defs>
  <rect width="1200" height="920" rx="28" fill="#f6faff"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#074f9d">One Analysis-Ready BAM—Four Different Calling Questions</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial" font-size="16" fill="#526b83">The caller, controls, filtering model, and output depend on the biological origin of the variant</text>
  <g font-family="Arial">
    <rect x="375" y="105" width="450" height="66" rx="15" fill="#173f68"/>
    <text x="600" y="136" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Analysis-ready BAM / CRAM</text><text x="600" y="158" text-anchor="middle" font-size="13" fill="#cfe3f7">+ reference · intervals · sample metadata · matched samples</text>

    <line x1="600" y1="171" x2="600" y2="205" stroke="#347bb7" stroke-width="4"/>
    <line x1="165" y1="205" x2="1035" y2="205" stroke="#347bb7" stroke-width="4"/>
    <line x1="165" y1="205" x2="165" y2="235" stroke="#347bb7" stroke-width="4" marker-end="url(#arrow)"/><line x1="455" y1="205" x2="455" y2="235" stroke="#347bb7" stroke-width="4" marker-end="url(#arrow)"/><line x1="745" y1="205" x2="745" y2="235" stroke="#347bb7" stroke-width="4" marker-end="url(#arrow)"/><line x1="1035" y1="205" x2="1035" y2="235" stroke="#347bb7" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(35 245)">
      <rect width="260" height="540" rx="18" fill="#e8f3ff" stroke="#6aa6dc" stroke-width="3"/>
      <text x="130" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#0756a5">Germline SNV / Indel</text>
      <text x="130" y="69" text-anchor="middle" font-size="14" fill="#526b83">constitutional inherited variants</text>
      <rect x="25" y="95" width="210" height="61" rx="10" fill="#fff"/><text x="130" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#173f68">HaplotypeCaller</text><text x="130" y="143" text-anchor="middle" font-size="13" fill="#526b83">-ERC GVCF per sample</text>
      <text x="130" y="180" text-anchor="middle" font-size="20" fill="#347bb7">↓</text>
      <rect x="25" y="195" width="210" height="66" rx="10" fill="#fff"/><text x="130" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#173f68">GenomicsDBImport</text><text x="130" y="244" text-anchor="middle" font-size="13" fill="#526b83">aggregate cohort GVCFs</text>
      <text x="130" y="286" text-anchor="middle" font-size="20" fill="#347bb7">↓</text>
      <rect x="25" y="301" width="210" height="61" rx="10" fill="#fff"/><text x="130" y="326" text-anchor="middle" font-size="15" font-weight="700" fill="#173f68">GenotypeGVCFs</text><text x="130" y="349" text-anchor="middle" font-size="13" fill="#526b83">joint genotyping</text>
      <text x="130" y="387" text-anchor="middle" font-size="20" fill="#347bb7">↓</text>
      <rect x="25" y="402" width="210" height="63" rx="10" fill="#fff"/><text x="130" y="427" text-anchor="middle" font-size="15" font-weight="700" fill="#173f68">VQSR / hard filter</text><text x="130" y="451" text-anchor="middle" font-size="13" fill="#526b83">cohort size dependent</text>
      <text x="130" y="505" text-anchor="middle" font-size="14" font-weight="700" fill="#0756a5">OUTPUT</text><text x="130" y="528" text-anchor="middle" font-size="13" fill="#526b83">Genotyped cohort VCF</text>
    </g>

    <g transform="translate(325 245)">
      <rect width="260" height="540" rx="18" fill="#f1ebfb" stroke="#9574c5" stroke-width="3"/>
      <text x="130" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#684889">Somatic SNV / Indel</text>
      <text x="130" y="69" text-anchor="middle" font-size="14" fill="#526b83">tumor-acquired short variants</text>
      <rect x="25" y="91" width="210" height="80" rx="10" fill="#fff"/><text x="130" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#173f68">Tumor ± matched normal</text><text x="130" y="140" text-anchor="middle" font-size="13" fill="#526b83">germline resource + PoN</text><text x="130" y="159" text-anchor="middle" font-size="13" fill="#526b83">F1R2 orientation evidence</text>
      <text x="130" y="197" text-anchor="middle" font-size="20" fill="#347bb7">↓</text>
      <rect x="25" y="212" width="210" height="61" rx="10" fill="#fff"/><text x="130" y="237" text-anchor="middle" font-size="15" font-weight="700" fill="#173f68">Mutect2</text><text x="130" y="260" text-anchor="middle" font-size="13" fill="#526b83">local assembly model</text>
      <text x="130" y="298" text-anchor="middle" font-size="20" fill="#347bb7">↓</text>
      <rect x="25" y="313" width="210" height="79" rx="10" fill="#fff"/><text x="130" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#173f68">GetPileupSummaries</text><text x="130" y="360" text-anchor="middle" font-size="13" fill="#526b83">CalculateContamination</text><text x="130" y="381" text-anchor="middle" font-size="13" fill="#526b83">LearnReadOrientationModel</text>
      <text x="130" y="417" text-anchor="middle" font-size="20" fill="#347bb7">↓</text>
      <rect x="25" y="429" width="210" height="58" rx="10" fill="#fff"/><text x="130" y="454" text-anchor="middle" font-size="15" font-weight="700" fill="#173f68">FilterMutectCalls</text><text x="130" y="476" text-anchor="middle" font-size="13" fill="#526b83">retain PASS + evidence</text>
      <text x="130" y="515" text-anchor="middle" font-size="14" font-weight="700" fill="#684889">OUTPUT</text><text x="130" y="537" text-anchor="middle" font-size="13" fill="#526b83">Somatic VCF + filter reasons</text>
    </g>

    <g transform="translate(615 245)">
      <rect width="260" height="540" rx="18" fill="#e9f8f3" stroke="#46ad8d" stroke-width="3"/>
      <text x="130" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#24745f">Copy Number</text>
      <text x="130" y="69" text-anchor="middle" font-size="14" fill="#526b83">read depth + allelic imbalance</text>
      <rect x="25" y="91" width="210" height="80" rx="10" fill="#fff"/><text x="130" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#173f68">CollectReadCounts</text><text x="130" y="140" text-anchor="middle" font-size="13" fill="#526b83">normal read-count PoN</text><text x="130" y="159" text-anchor="middle" font-size="13" fill="#526b83">CollectAllelicCounts</text>
      <text x="130" y="197" text-anchor="middle" font-size="20" fill="#347bb7">↓</text>
      <rect x="25" y="212" width="210" height="61" rx="10" fill="#fff"/><text x="130" y="237" text-anchor="middle" font-size="15" font-weight="700" fill="#173f68">DenoiseReadCounts</text><text x="130" y="260" text-anchor="middle" font-size="13" fill="#526b83">log2 copy ratio</text>
      <text x="130" y="298" text-anchor="middle" font-size="20" fill="#347bb7">↓</text>
      <rect x="25" y="313" width="210" height="61" rx="10" fill="#fff"/><text x="130" y="338" text-anchor="middle" font-size="15" font-weight="700" fill="#173f68">ModelSegments</text><text x="130" y="361" text-anchor="middle" font-size="13" fill="#526b83">copy ratio + allele fraction</text>
      <text x="130" y="399" text-anchor="middle" font-size="20" fill="#347bb7">↓</text>
      <rect x="25" y="414" width="210" height="61" rx="10" fill="#fff"/><text x="130" y="439" text-anchor="middle" font-size="15" font-weight="700" fill="#173f68">CallCopyRatioSegments</text><text x="130" y="462" text-anchor="middle" font-size="13" fill="#526b83">gain · neutral · loss</text>
      <text x="130" y="510" text-anchor="middle" font-size="14" font-weight="700" fill="#24745f">OUTPUT</text><text x="130" y="532" text-anchor="middle" font-size="13" fill="#526b83">Segment tables + plots</text>
    </g>

    <g transform="translate(905 245)">
      <rect width="260" height="540" rx="18" fill="#fff5df" stroke="#e3b341" stroke-width="3"/>
      <text x="130" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#8d5d08">Mitochondrial</text>
      <text x="130" y="69" text-anchor="middle" font-size="14" fill="#526b83">heteroplasmy on circular mtDNA</text>
      <rect x="25" y="91" width="210" height="80" rx="10" fill="#fff"/><text x="130" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#173f68">Extract chrM reads</text><text x="130" y="140" text-anchor="middle" font-size="13" fill="#526b83">align to standard</text><text x="130" y="159" text-anchor="middle" font-size="13" fill="#526b83">+ shifted reference</text>
      <text x="130" y="197" text-anchor="middle" font-size="20" fill="#347bb7">↓</text>
      <rect x="25" y="212" width="210" height="61" rx="10" fill="#fff"/><text x="130" y="237" text-anchor="middle" font-size="15" font-weight="700" fill="#173f68">Mutect2</text><text x="130" y="260" text-anchor="middle" font-size="13" fill="#526b83">--mitochondria-mode</text>
      <text x="130" y="298" text-anchor="middle" font-size="20" fill="#347bb7">↓</text>
      <rect x="25" y="313" width="210" height="79" rx="10" fill="#fff"/><text x="130" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#173f68">Shift-back + merge calls</text><text x="130" y="360" text-anchor="middle" font-size="13" fill="#526b83">deduplicate boundary</text><text x="130" y="381" text-anchor="middle" font-size="13" fill="#526b83">FilterMutectCalls</text>
      <text x="130" y="417" text-anchor="middle" font-size="20" fill="#347bb7">↓</text>
      <rect x="25" y="429" width="210" height="58" rx="10" fill="#fff"/><text x="130" y="454" text-anchor="middle" font-size="15" font-weight="700" fill="#173f68">NUMT + contamination QC</text><text x="130" y="476" text-anchor="middle" font-size="13" fill="#526b83">heteroplasmy thresholds</text>
      <text x="130" y="515" text-anchor="middle" font-size="14" font-weight="700" fill="#8d5d08">OUTPUT</text><text x="130" y="537" text-anchor="middle" font-size="13" fill="#526b83">mtDNA heteroplasmy VCF</text>
    </g>

    <rect x="55" y="825" width="1090" height="55" rx="13" fill="#fff" stroke="#cadbea" stroke-width="2"/>
    <text x="600" y="858" text-anchor="middle" font-size="15" fill="#526b83">Somatic calling is not “tumor VCF minus normal VCF”; CNV and mtDNA also require dedicated statistical and technical models.</text>
  </g>
</svg>
