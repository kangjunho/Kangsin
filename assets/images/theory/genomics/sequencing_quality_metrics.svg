<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Sequencing quality assessment from FASTQ to variants</title>
  <desc id="desc">Sequencing quality is assessed at the raw read, library and alignment, and coverage and variant levels. A graph illustrates per-base quality decreasing near read ends and distinguishes base quality from mapping quality.</desc>
  <rect width="1200" height="760" rx="28" fill="#f6faff"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#074f9d">Sequencing Quality Is a Chain of Evidence</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="16" fill="#526b83">A good FASTQ does not guarantee a good alignment or a trustworthy variant call</text>

  <g font-family="Arial">
    <rect x="55" y="115" width="340" height="320" rx="18" fill="#fff" stroke="#c9dceb" stroke-width="2"/>
    <text x="225" y="153" text-anchor="middle" font-size="21" font-weight="700" fill="#0756a5">1 · FASTQ / base calls</text>
    <line x1="92" y1="365" x2="355" y2="365" stroke="#8ca9c4" stroke-width="2"/><line x1="92" y1="185" x2="92" y2="365" stroke="#8ca9c4" stroke-width="2"/>
    <line x1="92" y1="244" x2="355" y2="244" stroke="#e0a800" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="84" y="249" text-anchor="end" font-size="12" fill="#8d5d08">Q30</text><text x="224" y="391" text-anchor="middle" font-size="13" fill="#526b83">Position along read</text><text x="62" y="282" transform="rotate(-90 62 282)" text-anchor="middle" font-size="13" fill="#526b83">Phred score</text>
    <path d="M103 211 C150 202 202 209 244 216 S307 238 345 284" fill="none" stroke="#2f80c4" stroke-width="7" stroke-linecap="round"/>
    <text x="225" y="421" text-anchor="middle" font-size="14" fill="#526b83">Inspect per-base Q, adapters, N, GC, length</text>

    <rect x="430" y="115" width="340" height="320" rx="18" fill="#fff" stroke="#c9dceb" stroke-width="2"/>
    <text x="600" y="153" text-anchor="middle" font-size="21" font-weight="700" fill="#0756a5">2 · Library / alignment</text>
    <g font-size="15" fill="#173f68"><text x="470" y="206">✓ Mapping rate and MAPQ</text><text x="470" y="246">✓ Duplicate fraction</text><text x="470" y="286">✓ Insert-size distribution</text><text x="470" y="326">✓ Properly paired reads</text><text x="470" y="366">✓ Contamination / sample identity</text><text x="470" y="406">✓ Coverage bias and soft clipping</text></g>

    <rect x="805" y="115" width="340" height="320" rx="18" fill="#fff" stroke="#c9dceb" stroke-width="2"/>
    <text x="975" y="153" text-anchor="middle" font-size="21" font-weight="700" fill="#0756a5">3 · Coverage / variants</text>
    <g font-size="15" fill="#173f68"><text x="845" y="206">✓ Mean depth and callable breadth</text><text x="845" y="246">✓ Allele depth and balance</text><text x="845" y="286">✓ Strand / read-position bias</text><text x="845" y="326">✓ BaseQ and MAPQ of ALT reads</text><text x="845" y="366">✓ Normal–tumor contamination</text><text x="845" y="406">✓ FILTER and orthogonal validation</text></g>

    <rect x="55" y="470" width="1090" height="112" rx="16" fill="#eaf5ff"/>
    <text x="95" y="507" font-size="20" font-weight="700" fill="#0756a5">BaseQ ≠ MAPQ</text>
    <text x="95" y="541" font-size="16" fill="#173f68"><tspan font-weight="700">Base quality:</tspan> “Is this A/C/G/T call correct?”</text>
    <text x="625" y="541" font-size="16" fill="#173f68"><tspan font-weight="700">Mapping quality:</tspan> “Is this read placed at the correct locus?”</text>
    <text x="600" y="567" text-anchor="middle" font-size="14" fill="#526b83">A read can contain high-quality bases yet map ambiguously in a repetitive region.</text>

    <rect x="55" y="610" width="1090" height="96" rx="16" fill="#fff8e2" stroke="#e3b341" stroke-width="2"/>
    <text x="600" y="646" text-anchor="middle" font-size="18" font-weight="700" fill="#8d5d08">A warning flag is a question—not an automatic trimming command.</text>
    <text x="600" y="677" text-anchor="middle" font-size="14" fill="#526b83">Interpret FastQC and alignment metrics together with library type, platform, read length, reference, assay design, and downstream purpose.</text>
  </g>
</svg>
