<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">One genome, many molecular states</title>
  <desc id="desc">A mostly shared genome branches into two cell contexts with different epigenomes, transcriptomes, proteomes and metabolomes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6faff"/>
      <stop offset="1" stop-color="#eef7f3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#284766" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6d8299"/>
    </marker>
  </defs>

  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#123d66">One Genome, Many Molecular States</text>
  <text x="600" y="91" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4c6177">Most cells share nearly the same DNA sequence, but they do not use it in the same way.</text>

  <g filter="url(#shadow)">
    <rect x="58" y="205" width="260" height="274" rx="24" fill="#ffffff" stroke="#2d75bb" stroke-width="3"/>
    <circle cx="188" cy="274" r="48" fill="#e6f2ff" stroke="#2d75bb" stroke-width="3"/>
    <path d="M145 274 C157 247 173 301 188 274 C203 247 220 301 232 274" fill="none" stroke="#2d75bb" stroke-width="5"/>
    <path d="M145 254 C158 282 173 227 188 254 C203 282 219 227 232 254" fill="none" stroke="#57a3e7" stroke-width="3"/>
    <text x="188" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#164d7f">Genome</text>
    <text x="188" y="382" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#4c6177">DNA sequence</text>
    <text x="188" y="416" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#4c6177">relatively stable information</text>
    <text x="188" y="449" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7e91">with somatic variation as an exception</text>
  </g>

  <path d="M318 310 C375 310 392 222 452 222" fill="none" stroke="#6d8299" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M318 374 C375 374 392 487 452 487" fill="none" stroke="#6d8299" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="385" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#50677f">cell type · time</text>
  <text x="385" y="357" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#50677f">environment · disease</text>

  <g filter="url(#shadow)">
    <rect x="462" y="128" width="680" height="205" rx="24" fill="#ffffff" stroke="#4f8fca" stroke-width="2"/>
    <text x="497" y="171" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#164d7f">Cell type or state A</text>
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="497" y="197" width="142" height="92" rx="15" fill="#f0eaff" stroke="#7e60b9" stroke-width="2"/>
      <text x="568" y="230" text-anchor="middle" font-size="17" font-weight="700" fill="#604493">Epigenome</text>
      <text x="568" y="257" text-anchor="middle" font-size="14" fill="#5a6673">accessible DNA</text>
      <text x="568" y="278" text-anchor="middle" font-size="14" fill="#5a6673">and regulation</text>

      <rect x="654" y="197" width="142" height="92" rx="15" fill="#e4f7fb" stroke="#2c91a7" stroke-width="2"/>
      <text x="725" y="230" text-anchor="middle" font-size="17" font-weight="700" fill="#1f7487">Transcriptome</text>
      <text x="725" y="257" text-anchor="middle" font-size="14" fill="#5a6673">RNA being</text>
      <text x="725" y="278" text-anchor="middle" font-size="14" fill="#5a6673">expressed now</text>

      <rect x="811" y="197" width="142" height="92" rx="15" fill="#e9f7ea" stroke="#4a9a58" stroke-width="2"/>
      <text x="882" y="230" text-anchor="middle" font-size="17" font-weight="700" fill="#347440">Proteome</text>
      <text x="882" y="257" text-anchor="middle" font-size="14" fill="#5a6673">proteins and</text>
      <text x="882" y="278" text-anchor="middle" font-size="14" fill="#5a6673">their states</text>

      <rect x="968" y="197" width="142" height="92" rx="15" fill="#fff3df" stroke="#d18a25" stroke-width="2"/>
      <text x="1039" y="230" text-anchor="middle" font-size="17" font-weight="700" fill="#9d6414">Metabolome</text>
      <text x="1039" y="257" text-anchor="middle" font-size="14" fill="#5a6673">current chemical</text>
      <text x="1039" y="278" text-anchor="middle" font-size="14" fill="#5a6673">activity</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="462" y="370" width="680" height="205" rx="24" fill="#ffffff" stroke="#3f9b73" stroke-width="2"/>
    <text x="497" y="413" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#226448">Cell type or state B</text>
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="497" y="439" width="142" height="92" rx="15" fill="#f0eaff" stroke="#7e60b9" stroke-width="2"/>
      <text x="568" y="472" text-anchor="middle" font-size="17" font-weight="700" fill="#604493">Epigenome</text>
      <text x="568" y="499" text-anchor="middle" font-size="14" fill="#5a6673">different access</text>
      <text x="568" y="520" text-anchor="middle" font-size="14" fill="#5a6673">and regulation</text>

      <rect x="654" y="439" width="142" height="92" rx="15" fill="#e4f7fb" stroke="#2c91a7" stroke-width="2"/>
      <text x="725" y="472" text-anchor="middle" font-size="17" font-weight="700" fill="#1f7487">Transcriptome</text>
      <text x="725" y="499" text-anchor="middle" font-size="14" fill="#5a6673">different RNA</text>
      <text x="725" y="520" text-anchor="middle" font-size="14" fill="#5a6673">profile</text>

      <rect x="811" y="439" width="142" height="92" rx="15" fill="#e9f7ea" stroke="#4a9a58" stroke-width="2"/>
      <text x="882" y="472" text-anchor="middle" font-size="17" font-weight="700" fill="#347440">Proteome</text>
      <text x="882" y="499" text-anchor="middle" font-size="14" fill="#5a6673">different proteins</text>
      <text x="882" y="520" text-anchor="middle" font-size="14" fill="#5a6673">and signals</text>

      <rect x="968" y="439" width="142" height="92" rx="15" fill="#fff3df" stroke="#d18a25" stroke-width="2"/>
      <text x="1039" y="472" text-anchor="middle" font-size="17" font-weight="700" fill="#9d6414">Metabolome</text>
      <text x="1039" y="499" text-anchor="middle" font-size="14" fill="#5a6673">different chemical</text>
      <text x="1039" y="520" text-anchor="middle" font-size="14" fill="#5a6673">state</text>
    </g>
  </g>

  <rect x="92" y="617" width="1016" height="51" rx="15" fill="#173e63"/>
  <text x="600" y="649" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Omics profiles describe a biological sample in a specific cell, tissue, time and condition.</text>
</svg>
