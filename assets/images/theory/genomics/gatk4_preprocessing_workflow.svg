<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">GATK4 data preprocessing workflow</title>
  <desc id="desc">Short-read FASTQ files are aligned with read groups, merged and coordinate sorted, duplicate marked, recalibrated with BQSR, indexed and quality controlled to produce an analysis-ready BAM or CRAM.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#347bb7"/></marker></defs>
  <rect width="1200" height="760" rx="28" fill="#f6faff"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#074f9d">GATK4-Style Data Preprocessing</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial" font-size="16" fill="#526b83">Conceptual short-read workflow from FASTQ to analysis-ready BAM/CRAM</text>

  <g font-family="Arial">
    <rect x="55" y="108" width="1090" height="92" rx="16" fill="#fff" stroke="#cadbea" stroke-width="2"/>
    <text x="85" y="139" font-size="19" font-weight="700" fill="#173f68">Reference bundle prepared once</text>
    <rect x="85" y="154" width="130" height="30" rx="7" fill="#e8f3ff"/><text x="150" y="175" text-anchor="middle" font-size="13" fill="#0756a5">reference.fa</text>
    <rect x="235" y="154" width="130" height="30" rx="7" fill="#e8f3ff"/><text x="300" y="175" text-anchor="middle" font-size="13" fill="#0756a5">reference.fa.fai</text>
    <rect x="385" y="154" width="130" height="30" rx="7" fill="#e8f3ff"/><text x="450" y="175" text-anchor="middle" font-size="13" fill="#0756a5">reference.dict</text>
    <rect x="535" y="154" width="160" height="30" rx="7" fill="#e8f3ff"/><text x="615" y="175" text-anchor="middle" font-size="13" fill="#0756a5">known-sites VCF</text>
    <rect x="715" y="154" width="145" height="30" rx="7" fill="#e8f3ff"/><text x="787" y="175" text-anchor="middle" font-size="13" fill="#0756a5">target intervals</text>
    <rect x="880" y="154" width="225" height="30" rx="7" fill="#fff4d8"/><text x="992" y="175" text-anchor="middle" font-size="13" fill="#8d5d08">same genome build everywhere</text>

    <g transform="translate(55 245)">
      <rect width="160" height="130" rx="16" fill="#fff" stroke="#6aa6dc" stroke-width="2"/><circle cx="30" cy="30" r="19" fill="#0756a5"/><text x="30" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text><text x="80" y="33" text-anchor="middle" font-size="18" font-weight="700" fill="#0756a5">Input QC</text><text x="80" y="70" text-anchor="middle" font-size="14" fill="#526b83">FASTQ R1 / R2</text><text x="80" y="94" text-anchor="middle" font-size="13" fill="#526b83">BaseQ · adapter</text><text x="80" y="115" text-anchor="middle" font-size="13" fill="#526b83">sample metadata</text>
    </g>
    <line x1="220" y1="310" x2="248" y2="310" stroke="#347bb7" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(255 245)">
      <rect width="160" height="130" rx="16" fill="#fff" stroke="#6aa6dc" stroke-width="2"/><circle cx="30" cy="30" r="19" fill="#0756a5"/><text x="30" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text><text x="88" y="33" text-anchor="middle" font-size="18" font-weight="700" fill="#0756a5">Align</text><text x="80" y="70" text-anchor="middle" font-size="14" fill="#526b83">BWA-MEM2</text><text x="80" y="94" text-anchor="middle" font-size="13" fill="#526b83">add @RG tags</text><text x="80" y="115" text-anchor="middle" font-size="13" fill="#526b83">lane/library aware</text>
    </g>
    <line x1="420" y1="310" x2="448" y2="310" stroke="#347bb7" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(455 245)">
      <rect width="160" height="130" rx="16" fill="#fff" stroke="#6aa6dc" stroke-width="2"/><circle cx="30" cy="30" r="19" fill="#0756a5"/><text x="30" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text><text x="91" y="33" text-anchor="middle" font-size="18" font-weight="700" fill="#0756a5">Merge + sort</text><text x="80" y="70" text-anchor="middle" font-size="14" fill="#526b83">merge by sample</text><text x="80" y="94" text-anchor="middle" font-size="13" fill="#526b83">coordinate order</text><text x="80" y="115" text-anchor="middle" font-size="13" fill="#526b83">retain read groups</text>
    </g>
    <line x1="620" y1="310" x2="648" y2="310" stroke="#347bb7" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(655 245)">
      <rect width="160" height="130" rx="16" fill="#fff" stroke="#9574c5" stroke-width="2"/><circle cx="30" cy="30" r="19" fill="#7451a5"/><text x="30" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text><text x="96" y="33" text-anchor="middle" font-size="18" font-weight="700" fill="#684889">Mark duplicates</text><text x="80" y="70" text-anchor="middle" font-size="14" fill="#526b83">PCR / optical</text><text x="80" y="94" text-anchor="middle" font-size="13" fill="#526b83">mark, do not invent</text><text x="80" y="115" text-anchor="middle" font-size="13" fill="#526b83">library metrics</text>
    </g>
    <line x1="820" y1="310" x2="848" y2="310" stroke="#347bb7" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(855 245)">
      <rect width="160" height="130" rx="16" fill="#fff" stroke="#46ad8d" stroke-width="2"/><circle cx="30" cy="30" r="19" fill="#24856b"/><text x="30" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">5</text><text x="96" y="33" text-anchor="middle" font-size="18" font-weight="700" fill="#24745f">BQSR model</text><text x="80" y="70" text-anchor="middle" font-size="14" fill="#526b83">BaseRecalibrator</text><text x="80" y="94" text-anchor="middle" font-size="13" fill="#526b83">cycle · context</text><text x="80" y="115" text-anchor="middle" font-size="13" fill="#526b83">known sites masked</text>
    </g>
    <line x1="1020" y1="310" x2="1048" y2="310" stroke="#347bb7" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(1055 245)">
      <rect width="90" height="130" rx="16" fill="#e9f8f3" stroke="#46ad8d" stroke-width="2"/><circle cx="24" cy="30" r="19" fill="#24856b"/><text x="24" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">6</text><text x="45" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#24745f">Apply</text><text x="45" y="93" text-anchor="middle" font-size="14" font-weight="700" fill="#24745f">BQSR</text><text x="45" y="116" text-anchor="middle" font-size="12" fill="#526b83">+ index</text>
    </g>

    <rect x="180" y="424" width="840" height="78" rx="16" fill="#e9f8f3" stroke="#46ad8d" stroke-width="3"/>
    <text x="600" y="458" text-anchor="middle" font-size="23" font-weight="700" fill="#24745f">Analysis-ready BAM / CRAM + index</text>
    <text x="600" y="484" text-anchor="middle" font-size="14" fill="#526b83">consistent build · valid read groups · duplicate flags · recalibrated BaseQ · coordinate sorted</text>

    <rect x="55" y="542" width="1090" height="142" rx="17" fill="#fff" stroke="#cadbea" stroke-width="2"/>
    <text x="85" y="576" font-size="19" font-weight="700" fill="#173f68">QC gates before calling</text>
    <text x="85" y="612" font-size="14" fill="#526b83">FASTQ</text><text x="152" y="612" font-size="14" fill="#173f68">FastQC / MultiQC</text>
    <text x="365" y="612" font-size="14" fill="#526b83">Alignment</text><text x="455" y="612" font-size="14" fill="#173f68">mapping rate · MAPQ · insert size · CIGAR</text>
    <text x="805" y="612" font-size="14" fill="#526b83">Library</text><text x="875" y="612" font-size="14" fill="#173f68">duplicate rate · complexity</text>
    <text x="85" y="648" font-size="14" fill="#526b83">Sample</text><text x="152" y="648" font-size="14" fill="#173f68">fingerprint · sex check · contamination</text>
    <text x="455" y="648" font-size="14" fill="#526b83">Coverage</text><text x="530" y="648" font-size="14" fill="#173f68">mean + breadth + target dropout</text>
    <text x="875" y="648" font-size="14" fill="#526b83">BQSR</text><text x="928" y="648" font-size="14" fill="#173f68">before/after covariates</text>
    <text x="600" y="719" text-anchor="middle" font-size="14" fill="#526b83">Implementations such as DRAGEN may fuse steps, but the required metadata and QC logic remain the same.</text>
  </g>
</svg>
