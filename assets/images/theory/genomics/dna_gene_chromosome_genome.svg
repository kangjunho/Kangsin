<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">DNA, gene, chromosome and genome hierarchy</title><desc id="desc">A DNA molecule contains genes and is packaged with proteins into chromosomes; the complete chromosome set constitutes the genome.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#4479ad"/></marker><linearGradient id="bg2"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#eaf4ff"/></linearGradient></defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg2)"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#074f9d">DNA → Gene → Chromosome → Genome</text>
  <g font-family="Arial">
    <g transform="translate(45 155)"><rect width="245" height="300" rx="18" fill="white" stroke="#8cb9e5" stroke-width="3"/><text x="122" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#0756a5">DNA</text><path d="M65 85 C165 120 75 165 180 205 M180 85 C80 120 170 165 65 205" fill="none" stroke="#1779d3" stroke-width="9"/><g stroke="#69b6ed" stroke-width="4"><line x1="85" y1="102" x2="159" y2="102"/><line x1="78" y1="130" x2="167" y2="130"/><line x1="78" y1="160" x2="167" y2="160"/><line x1="86" y1="190" x2="158" y2="190"/></g><text x="122" y="245" text-anchor="middle" font-size="16" fill="#526b83">A polymer of A, C, G, T</text><text x="122" y="272" text-anchor="middle" font-size="15" fill="#526b83">Stores genetic information</text></g>
    <g transform="translate(335 155)"><rect width="245" height="300" rx="18" fill="white" stroke="#8cb9e5" stroke-width="3"/><text x="122" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#0756a5">Gene</text><line x1="35" y1="140" x2="210" y2="140" stroke="#789" stroke-width="4"/><rect x="50" y="110" width="35" height="60" rx="4" fill="#247fce"/><rect x="100" y="110" width="45" height="60" rx="4" fill="#45a5d9"/><rect x="165" y="110" width="30" height="60" rx="4" fill="#247fce"/><text x="122" y="210" text-anchor="middle" font-size="16" fill="#526b83">A DNA sequence producing</text><text x="122" y="235" text-anchor="middle" font-size="16" fill="#526b83">functional RNA or protein</text><text x="122" y="272" text-anchor="middle" font-size="14" fill="#6d8296">Includes context and regulation</text></g>
    <g transform="translate(625 155)"><rect width="245" height="300" rx="18" fill="white" stroke="#8cb9e5" stroke-width="3"/><text x="122" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#0756a5">Chromosome</text><path d="M80 88 C125 125 120 168 80 220 M165 88 C120 125 125 168 165 220" fill="none" stroke="#6b64b9" stroke-width="25" stroke-linecap="round"/><circle cx="122" cy="154" r="16" fill="#f4b942"/><text x="122" y="255" text-anchor="middle" font-size="16" fill="#526b83">One long DNA molecule</text><text x="122" y="280" text-anchor="middle" font-size="15" fill="#526b83">packaged with proteins</text></g>
    <g transform="translate(915 155)"><rect width="245" height="300" rx="18" fill="white" stroke="#8cb9e5" stroke-width="3"/><text x="122" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#0756a5">Genome</text><g stroke="#4e74aa" stroke-width="9" stroke-linecap="round"><path d="M52 93l30 48M82 93l-30 48M112 93l30 48M142 93l-30 48M172 93l30 48M202 93l-30 48M52 170l30 48M82 170l-30 48M112 170l30 48M142 170l-30 48M172 170l30 48M202 170l-30 48"/></g><text x="122" y="257" text-anchor="middle" font-size="16" fill="#526b83">The complete set of DNA</text><text x="122" y="282" text-anchor="middle" font-size="15" fill="#526b83">in a cell or organism</text></g>
  </g>
  <g stroke="#4479ad" stroke-width="4" marker-end="url(#a)"><line x1="292" y1="305" x2="327" y2="305"/><line x1="582" y1="305" x2="617" y2="305"/><line x1="872" y1="305" x2="907" y2="305"/></g>
  <rect x="205" y="510" width="790" height="65" rx="14" fill="#dceeff"/><text x="600" y="550" text-anchor="middle" font-family="Arial" font-size="18" fill="#154f85">Genes are functional regions of DNA; chromosomes package DNA; all DNA together forms the genome.</text>
</svg>
