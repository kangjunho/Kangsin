<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Coverage, repetitive regions, and long reads</title>
  <desc id="desc">Mean thirty times coverage is an average and local depth can vary. Short reads wholly inside a repeat map ambiguously, while a long read spanning unique sequence on both sides can locate and count the repeat.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#347bb7"/></marker>
    <pattern id="repeatPattern" width="36" height="28" patternUnits="userSpaceOnUse"><rect width="36" height="28" fill="#fff1bd"/><path d="M0 28L18 0M18 28L36 0" stroke="#e3a81a" stroke-width="5"/></pattern>
  </defs>
  <rect width="1200" height="760" rx="28" fill="#f6faff"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#074f9d">Coverage Is Uneven—and Repeats Need Context</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="16" fill="#526b83">Mean depth, local mappability, and read length answer different questions</text>

  <rect x="55" y="112" width="1090" height="202" rx="18" fill="#ffffff" stroke="#d2e1ef" stroke-width="2"/>
  <text x="85" y="148" font-family="Arial" font-size="21" font-weight="700" fill="#173f68">1 · “30× WGS” is a genome-wide mean, not 30 reads at every base</text>
  <line x1="105" y1="264" x2="1095" y2="264" stroke="#8ca9c4" stroke-width="4"/>
  <g stroke="#2f80c4" stroke-width="8" stroke-linecap="round">
    <line x1="112" y1="187" x2="265" y2="187"/><line x1="180" y1="202" x2="346" y2="202"/><line x1="123" y1="217" x2="297" y2="217"/><line x1="240" y1="232" x2="414" y2="232"/>
    <line x1="455" y1="187" x2="585" y2="187"/><line x1="472" y1="202" x2="633" y2="202"/>
    <line x1="735" y1="187" x2="903" y2="187"/><line x1="701" y1="202" x2="858" y2="202"/><line x1="764" y1="217" x2="939" y2="217"/><line x1="831" y1="232" x2="1037" y2="232"/><line x1="867" y1="247" x2="1080" y2="247"/>
  </g>
  <rect x="640" y="169" width="53" height="96" rx="5" fill="#ffe8e8" stroke="#d9534f" stroke-width="2"/>
  <text x="666" y="286" text-anchor="middle" font-family="Arial" font-size="13" fill="#b12b27">low / zero depth</text>
  <text x="90" y="300" font-family="Arial" font-size="14" fill="#526b83">Random sampling · GC/capture bias · duplicates · mapping ambiguity → local depth and callable breadth vary</text>

  <rect x="55" y="338" width="1090" height="272" rx="18" fill="#ffffff" stroke="#d2e1ef" stroke-width="2"/>
  <text x="85" y="376" font-family="Arial" font-size="21" font-weight="700" fill="#173f68">2 · A short read may not bridge a repetitive locus</text>
  <text x="85" y="410" font-family="Arial" font-size="15" fill="#526b83">Example locus</text>
  <rect x="165" y="391" width="218" height="38" rx="7" fill="#dff2ff"/><rect x="383" y="391" width="430" height="38" fill="url(#repeatPattern)"/><rect x="813" y="391" width="218" height="38" rx="7" fill="#dff2ff"/>
  <text x="274" y="416" text-anchor="middle" font-family="Courier New" font-size="17" fill="#0756a5">AGTCCGAT</text>
  <text x="598" y="416" text-anchor="middle" font-family="Courier New" font-size="17" font-weight="700" fill="#765300">CAG · CAG · CAG · CAG · CAG</text>
  <text x="922" y="416" text-anchor="middle" font-family="Courier New" font-size="17" fill="#0756a5">TTGACCTA</text>
  <text x="274" y="451" text-anchor="middle" font-family="Arial" font-size="13" fill="#526b83">unique left anchor</text><text x="598" y="451" text-anchor="middle" font-family="Arial" font-size="13" fill="#526b83">repeat</text><text x="922" y="451" text-anchor="middle" font-family="Arial" font-size="13" fill="#526b83">unique right anchor</text>

  <text x="85" y="493" font-family="Arial" font-size="16" font-weight="700" fill="#b12b27">Short reads</text>
  <g stroke="#d9534f" stroke-width="8" stroke-linecap="round"><line x1="260" y1="485" x2="425" y2="485"/><line x1="425" y1="505" x2="590" y2="505"/><line x1="555" y1="485" x2="720" y2="485"/><line x1="735" y1="505" x2="900" y2="505"/></g>
  <text x="935" y="499" font-family="Arial" font-size="14" fill="#b12b27">repeat-only reads fit multiple positions</text>

  <text x="85" y="554" font-family="Arial" font-size="16" font-weight="700" fill="#24745f">Long read</text>
  <line x1="260" y1="548" x2="910" y2="548" stroke="#28a27a" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="935" y="554" font-family="Arial" font-size="14" fill="#24745f">both anchors + full repeat in one molecule</text>
  <text x="598" y="588" text-anchor="middle" font-family="Arial" font-size="14" fill="#526b83">The span reveals locus, repeat count, structural change, and often haplotype phase.</text>

  <rect x="55" y="636" width="1090" height="78" rx="15" fill="#eaf5ff"/>
  <text x="600" y="669" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#0756a5">More depth adds repeated observations; longer reads add genomic context.</text>
  <text x="600" y="695" text-anchor="middle" font-family="Arial" font-size="14" fill="#526b83">Long reads help with centromeres, segmental duplications, pseudogenes, repeat expansions, phasing, and structural variants—but still require adequate input quality and coverage.</text>
</svg>
