<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Coding and non-coding regions of the human genome</title><desc id="desc">A protein-coding gene contains regulatory regions, untranslated regions, exons and introns; protein-coding exons make up about 1.5 percent of the human genome, while non-coding DNA includes introns, regulatory elements, non-coding RNA genes, repeats and intergenic regions.</desc>
  <rect width="1200" height="650" rx="28" fill="#f6faff"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#074f9d">Coding and Non-coding Genome</text>
  <g font-family="Arial"><text x="70" y="118" font-size="21" font-weight="700" fill="#173f68">A protein-coding gene locus</text><line x1="80" y1="250" x2="1120" y2="250" stroke="#71869a" stroke-width="5"/>
    <rect x="105" y="205" width="115" height="90" rx="8" fill="#f4b942"/><text x="162" y="190" text-anchor="middle" font-size="15" fill="#8d5d08">Enhancer</text><path d="M220 222 C270 150 330 160 355 215" fill="none" stroke="#e0a11e" stroke-width="4" stroke-dasharray="7 6"/>
    <rect x="330" y="215" width="100" height="70" rx="6" fill="#62a9e3"/><text x="380" y="198" text-anchor="middle" font-size="15" fill="#0756a5">Promoter</text>
    <rect x="455" y="205" width="80" height="90" rx="5" fill="#8bc3ed"/><rect x="535" y="205" width="105" height="90" rx="5" fill="#176fd0"/><rect x="760" y="205" width="105" height="90" rx="5" fill="#176fd0"/><rect x="865" y="205" width="75" height="90" rx="5" fill="#8bc3ed"/><line x1="640" y1="250" x2="760" y2="250" stroke="#8e71b5" stroke-width="12"/><text x="700" y="190" text-anchor="middle" font-size="15" fill="#684889">Intron</text><text x="697" y="332" text-anchor="middle" font-size="15" fill="#0756a5">Protein-coding exons</text><text x="495" y="332" text-anchor="middle" font-size="15" fill="#4b7598">5′ UTR</text><text x="902" y="332" text-anchor="middle" font-size="15" fill="#4b7598">3′ UTR</text><rect x="980" y="215" width="100" height="70" rx="6" fill="#5bb99f"/><text x="1030" y="198" text-anchor="middle" font-size="15" fill="#24745f">Regulatory</text>
    <text x="600" y="385" text-anchor="middle" font-size="15" fill="#526b83">Only the coding portion of exons is translated into protein; genes also contain non-coding and regulatory regions.</text>
  </g>
  <g font-family="Arial"><text x="70" y="445" font-size="21" font-weight="700" fill="#173f68">The human genome</text><rect x="70" y="475" width="1060" height="65" rx="12" fill="#dce7f2"/><rect x="70" y="475" width="16" height="65" rx="8" fill="#176fd0"/><text x="95" y="573" font-size="16" font-weight="700" fill="#176fd0">~1.5% protein-coding exome</text><text x="1090" y="573" text-anchor="end" font-size="16" font-weight="700" fill="#526b83">Non-coding DNA: introns · regulatory elements · ncRNA genes · repeats · intergenic regions</text></g>
  <rect x="70" y="598" width="1060" height="34" rx="8" fill="#fff3cd"/><text x="600" y="621" text-anchor="middle" font-family="Arial" font-size="15" fill="#715500">Non-coding does not mean non-functional; however, biochemical activity alone is not identical to proven biological function.</text>
</svg>
