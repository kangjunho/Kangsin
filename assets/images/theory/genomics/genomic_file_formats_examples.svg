<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Examples of common genomic file formats</title>
  <desc id="desc">Examples of FASTA, FASTQ, SAM as a readable representation of BAM and CRAM, VCF, BED, and GTF formats with their coordinate conventions.</desc>
  <rect width="1200" height="820" rx="28" fill="#f6faff"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#074f9d">What Genomic Files Actually Look Like</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="16" fill="#526b83">Small illustrative records—real files can contain millions to billions of lines or binary records</text>

  <g font-family="Arial">
    <g transform="translate(50 112)"><rect width="530" height="195" rx="16" fill="#fff" stroke="#c9dceb" stroke-width="2"/><text x="24" y="37" font-size="21" font-weight="700" fill="#0756a5">FASTA · reference sequence</text><rect x="22" y="55" width="486" height="92" rx="10" fill="#172536"/><text x="42" y="87" font-family="Courier New" font-size="18" fill="#82c7ff">&gt;chr1</text><text x="42" y="120" font-family="Courier New" font-size="18" fill="#7ce0b8">ACGTTGCAACCTGATCGTAC...</text><text x="24" y="176" font-size="14" fill="#526b83">Header starts with &gt;; sequence follows. Check genome build and contig names.</text></g>
    <g transform="translate(620 112)"><rect width="530" height="195" rx="16" fill="#fff" stroke="#c9dceb" stroke-width="2"/><text x="24" y="37" font-size="21" font-weight="700" fill="#0756a5">FASTQ · reads + base quality</text><rect x="22" y="55" width="486" height="108" rx="10" fill="#172536"/><text x="42" y="82" font-family="Courier New" font-size="16" fill="#82c7ff">@read001</text><text x="42" y="106" font-family="Courier New" font-size="16" fill="#7ce0b8">ACGTTGCA</text><text x="42" y="130" font-family="Courier New" font-size="16" fill="#ffd36a">+</text><text x="42" y="154" font-family="Courier New" font-size="16" fill="#e9b9ff">IIIIIIII</text><text x="270" y="104" font-size="14" fill="#9fb1c5">8 bases</text><text x="270" y="143" font-size="14" fill="#9fb1c5">8 quality chars</text></g>

    <g transform="translate(50 332)"><rect width="530" height="195" rx="16" fill="#fff" stroke="#c9dceb" stroke-width="2"/><text x="24" y="37" font-size="21" font-weight="700" fill="#0756a5">SAM view · readable BAM/CRAM alignment</text><rect x="22" y="55" width="486" height="92" rx="10" fill="#172536"/><text x="37" y="84" font-family="Courier New" font-size="14" fill="#82c7ff">@SQ SN:chr1 LN:248956422</text><text x="37" y="116" font-family="Courier New" font-size="14" fill="#7ce0b8">read001  99  chr1  101  60  8M ...</text><text x="37" y="139" font-family="Courier New" font-size="14" fill="#e9b9ff">ACGTTGCA  IIIIIIII</text><text x="24" y="176" font-size="14" fill="#526b83">BAM is compressed binary SAM; CRAM compresses relative to a reference.</text></g>
    <g transform="translate(620 332)"><rect width="530" height="195" rx="16" fill="#fff" stroke="#c9dceb" stroke-width="2"/><text x="24" y="37" font-size="21" font-weight="700" fill="#0756a5">VCF · variants and genotypes</text><rect x="22" y="55" width="486" height="92" rx="10" fill="#172536"/><text x="37" y="84" font-family="Courier New" font-size="13" fill="#82c7ff">#CHROM POS     ID REF ALT QUAL FILTER INFO</text><text x="37" y="119" font-family="Courier New" font-size="14" fill="#7ce0b8">chr1   123456  .  A   G   99   PASS   DP=32</text><text x="24" y="176" font-size="14" fill="#526b83">Coordinates are 1-based; FILTER and FORMAT must be interpreted with metadata.</text></g>

    <g transform="translate(50 552)"><rect width="530" height="195" rx="16" fill="#fff" stroke="#c9dceb" stroke-width="2"/><text x="24" y="37" font-size="21" font-weight="700" fill="#0756a5">BED · genomic intervals</text><rect x="22" y="55" width="486" height="82" rx="10" fill="#172536"/><text x="42" y="88" font-family="Courier New" font-size="17" fill="#7ce0b8">chr1  100  200  regionA</text><text x="42" y="118" font-family="Courier New" font-size="15" fill="#9fb1c5">covers bases 101–200 in 1-based display</text><text x="24" y="166" font-size="14" font-weight="700" fill="#b46a00">0-based, half-open: start included; end excluded.</text></g>
    <g transform="translate(620 552)"><rect width="530" height="195" rx="16" fill="#fff" stroke="#c9dceb" stroke-width="2"/><text x="24" y="37" font-size="21" font-weight="700" fill="#0756a5">GTF · gene / transcript annotation</text><rect x="22" y="55" width="486" height="82" rx="10" fill="#172536"/><text x="36" y="86" font-family="Courier New" font-size="14" fill="#7ce0b8">chr1 GENCODE exon 101 200 . + .</text><text x="36" y="116" font-family="Courier New" font-size="14" fill="#e9b9ff">gene_id "ENSG..."; transcript_id "ENST...";</text><text x="24" y="166" font-size="14" font-weight="700" fill="#24745f">1-based, inclusive. Annotation release matters.</text></g>
  </g>
  <text x="600" y="790" text-anchor="middle" font-family="Arial" font-size="15" fill="#526b83">A format name is not enough: always record reference build, annotation version, coordinate convention, compression, and index files.</text>
</svg>
